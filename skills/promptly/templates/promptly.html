<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE" id="theme-color">
<title>Promptly 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin lets the image capture read this sheet and embed the fonts; without it saved slides fall back to wider system fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin>
<style>
  :root {
    --ink: #161616;
    --paper: #F3F2EE;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --grain: 0.34;
    --blur: 7px;
  }
  :root.dark { --ink: #EEECE8; --paper: #151515; }
  :root.dark body { background: #0A0A0A; }
  :root.dark .receipt { background: #1F1F1F; }
  /* Difference blending goes muddy over a dark field, so dark mode uses plain ink. */
  :root.dark .blend, :root.dark .hot { mix-blend-mode: normal; color: var(--ink); }
  :root.dark .rowg, :root.dark .colg, :root.dark .vline { border-color: rgb(238 236 232 / 0.2); }
  :root.dark .orb.ghost .ring { border-color: rgb(238 236 232 / 0.45); }
  :root.dark .orb.ghost i { color: rgb(238 236 232 / 0.6); }
  :root.dark .mostyou { color: color-mix(in srgb, var(--c3) 50%, #FFFFFF); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #E4E2DD; color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; overflow: hidden;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }

  .edge { display: none; }
  .stage {
    position: relative;
    height: min(100dvh - 32px, 920px);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    container-type: size;
    border-radius: 3cqw;
    background: var(--paper);
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.06), 0 30px 70px -24px rgb(0 0 0 / 0.3);
  }
  @media (max-width: 560px) {
    .stage { height: 100dvh; width: 100vw; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
    /* Full screen on a phone: two solid blocks behind the stage take the field's top and bottom colours (set from
       script), so the strips Safari leaves under the status bar and the toolbar match the slide. Solid colours, because
       Safari tints its bars from background colours and ignores gradients. */
    html, body, :root.dark body { background: var(--paper); }
    .edge { display: block; position: fixed; left: 0; right: 0; height: 50lvh; background: var(--paper); }
    .edge.t { top: 0; } .edge.b { bottom: 0; }
  }

  /* The field and the slides sit in one layer that pinches to zoom; the card, progress bar, dock and grain stay outside
     it, and script holds each slide's words still. Unzoomed it carries no transform, which would make it a stacking
     context of its own. The stage takes over the pinch so the page itself doesn't zoom. */
  .stage { touch-action: none; }
  .view, .top, .fp-key { transform-origin: 0 0; }
  .view { position: absolute; inset: 0; }
  /* Held still, the words can't see the field behind them to blend with, so they go plain ink, as in dark mode. */
  .stage.zoomed .top .blend { mix-blend-mode: normal; color: var(--ink); }
  .stage.zoomed .nav button { cursor: grab; }
  .stage.zoomed.panning .nav button { cursor: grabbing; }

  /* Morphing colour field, rendered small and blurred up */
  #field { position: absolute; inset: -5%; width: 110%; height: 110%; filter: blur(var(--blur)); }
  .sheet { position: absolute; inset: auto 0 0; height: var(--sheet, 40%); background: var(--paper); transition: height 820ms var(--ease-out); }
  /* Cover → volume: the page bleeds away like ink on wet paper */
  .burn-cover { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
  .burn-cover canvas { position: absolute; inset: -5%; width: 110%; height: 110%; filter: blur(var(--blur)); }
  #burn { position: absolute; inset: 0; z-index: 8; width: 100%; height: 100%; pointer-events: none; filter: blur(0.7px); display: none; }
  .grain { position: absolute; inset: -40%; z-index: 9; pointer-events: none; opacity: var(--grain); mix-blend-mode: overlay; background-size: 220px; animation: grain 1s steps(5) infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-4%, 3%); } 40% { transform: translate(3%, -2%); } 60% { transform: translate(-2%, -4%); } 80% { transform: translate(4%, 2%); } }

  .progress { position: absolute; z-index: 10; inset: 3cqw 5.5cqw auto; display: flex; gap: 1cqw; }
  .progress span { position: relative; cursor: pointer; flex: 1; height: 0.5cqw; border-radius: 1cqw; background: color-mix(in srgb, var(--fg) 25%, transparent); transition: background 300ms; }
  .progress span.done, .progress span.active { background: var(--fg); }
  /* Each segment jumps to its slide; the tap target is taller than the line. */
  .progress span::before { content: ""; position: absolute; inset: -2.6cqw -0.5cqw; }

  /* No z-index here: slides must not form their own stacking context, or blend modes can't see the field. */
  .slide { position: absolute; inset: 0; visibility: hidden; }
  .slide.active { visibility: visible; }
  .top { position: absolute; inset: 0 0 auto; height: calc(100% - var(--sheet)); padding: 7.5cqw 5.5cqw 4.6cqw; display: flex; flex-direction: column; gap: 2.2cqw; color: var(--fg); }
  .panel { position: absolute; inset: auto 0 0; height: var(--sheet); padding: 4.8cqw 5.5cqw 5.5cqw; display: flex; flex-direction: column; gap: 2.8cqw; color: var(--ink); }
  .abs { position: absolute; inset: 0; pointer-events: none; color: var(--ink); }
  .grow { flex: 1; min-height: 0; }

  .hud { display: flex; justify-content: space-between; gap: 3cqw; font: 500 2.2cqw/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .hud span:last-child { opacity: 0.6; }
  .lbl { font: 500 2.5cqw/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  .micro { font: 400 1.75cqw/1.35 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.55; }
  .body { font: 400 3.5cqw/1.42 var(--sans); text-wrap: pretty; }
  .display { font: 300 11cqw/0.92 var(--sans); letter-spacing: -0.045em; text-wrap: balance; }
  .roll { font-variant-numeric: tabular-nums; }
  /* White + difference: near-black on paper, the heat's opposite colour wherever a hotspot passes behind */
  .blend { color: #fff; mix-blend-mode: difference; }
  .big { font: 300 30cqw/0.82 var(--sans); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mid { font: 300 15cqw/0.85 var(--sans); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .unit { font: 300 0.22em var(--sans); letter-spacing: -0.01em; opacity: 0.6; margin-left: 0.25em; }
  .quote { font: 400 8cqw/1.05 var(--sans); letter-spacing: -0.03em; text-wrap: pretty; }

  /* The slide labels hold one line, whatever font they end up in. */
  .hud span:first-child, .ph p:first-child { white-space: nowrap; }
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 3cqw; padding-bottom: 2.2cqw; border-bottom: 0.25cqw solid color-mix(in srgb, var(--ink) 12%, transparent); }

  .cells { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw 5cqw; }
  .cell { display: flex; justify-content: space-between; align-items: flex-end; gap: 2cqw; }
  .cell .val { font: 400 5.6cqw/1.05 var(--sans); letter-spacing: -0.02em; margin-top: 0.8cqw; font-variant-numeric: tabular-nums; }
  .cell .sub { font: 400 2.6cqw var(--sans); opacity: 0.55; margin-left: 0.4em; letter-spacing: 0; }



  /* Labels that ride on hotspots; positions are set every frame from the field */
  .hot { position: absolute; translate: -50% -50%; display: flex; flex-direction: column; align-items: flex-start; white-space: nowrap; }
  .hot i { padding: 0.35cqw 0.9cqw; background: #111; color: rgb(243 242 238 / 0.7); font: 500 1.5cqw/1.2 var(--mono); font-style: normal; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .hot.side { translate: 4.4cqw -50%; }
  .redact { cursor: pointer; }
  .redact:not(.shown) { letter-spacing: 0; opacity: 0.85; }
  .hot b { padding: 0.8cqw 1.5cqw 1cqw; background: #E9E6DF; color: #111; font: 400 4.6cqw/1 var(--sans); letter-spacing: -0.03em; }
  /* Manners that never happened: an empty dashed ring where the glow would be */
  .orb.ghost { position: absolute; translate: -50% -50%; display: flex; flex-direction: column; white-space: nowrap; color: var(--ink); text-shadow: none; opacity: 0; }
  .orb.ghost .ring { border: 1px dashed rgb(22 22 22 / 0.45); }
  .orb.ghost b { font-family: var(--sans); font-weight: 400; line-height: 1; letter-spacing: -0.03em; }
  .orb.ghost i { color: rgb(22 22 22 / 0.6); font: 500 1.6cqw/1.2 var(--mono); font-style: normal; letter-spacing: 0.06em; }
  .slide.active .orb.ghost { animation: fade-in 800ms var(--ease-out) forwards; animation-delay: calc(var(--k) * 150ms + 1200ms); }
  .side-h { position: absolute; top: 19cqw; opacity: 0.7; }
  .orb { align-items: center; color: #fff; text-shadow: 0 0 2cqw rgb(60 20 80 / 0.25); }
  .orb .ring { position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); translate: -50% -50%; border: 1px solid rgb(255 255 255 / 0.85); border-radius: 50%; }
  .orb b { padding: 0; background: none; color: inherit; }
  /* Tells can run to four words, so their names wrap inside the ring instead of running past it. */
  .orb.wrap b { width: max-content; max-width: calc(var(--d) * 0.86); white-space: normal; text-wrap: balance; text-align: center; line-height: 1.02; }
  .orb i { padding: 0; margin-top: 0.8cqw; background: none; color: rgb(255 255 255 / 0.85); font-size: 1.6cqw; }

  /* Cover: ASCII on three depth planes behind the title; the far ones are softer */
  .ascii { position: absolute; inset: 0 0 var(--sheet); pointer-events: none; -webkit-mask-image: linear-gradient(#000 50%, transparent 92%); mask-image: linear-gradient(#000 50%, transparent 92%); }
  .ascii canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ascii .back { filter: blur(1.6px); }

  @keyframes fade-in { to { opacity: 1; } }
  @keyframes draw-line { to { stroke-dashoffset: 0; } }

  /* Agents: nested circles on a crosshair */
  .orbit { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .orbit circle, .orbit line, .orbit path { fill: none; stroke: #fff; stroke-width: 2.2; }
  .orbit .faint { stroke-opacity: 0.55; stroke-width: 1.4; }
  .orbit .dash { stroke-dasharray: 6 8; stroke-opacity: 0.95; stroke-width: 1.6; }
  .orbit .ring { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .slide.active .orbit .ring { animation: draw-line 1600ms var(--ease-out) forwards; animation-delay: calc(var(--d, 0) * 300ms + 200ms); }
  /* Agent names set along their circles */
  .orbit text { stroke: none; fill: var(--ink); }
  .orbit .agl { font: 500 24px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .orbit .agl .n { opacity: 0.5; }
  .slide.active .orbit text { animation: fade-in 700ms var(--ease-out) both 500ms; }

  /* Machine-vision tracking: a pink target on a moving point */
  .mark { position: absolute; width: 1.8cqw; height: 1.8cqw; translate: -50% -50%; border: 1px solid #FF4FA0; }
  .mark::after { content: ""; position: absolute; inset: 0.45cqw; background: #FF4FA0; }
  .links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .links line { stroke: #fff; stroke-opacity: 0.9; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .slide.active .mark, .slide.active .links line { animation: fade-in 600ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 120ms + 300ms); }
  /* Readout chips: a value cell with a readout strip on top; a tick ties each to its node */
  .chip { position: absolute; display: flex; translate: 3.4cqw -50%; white-space: nowrap; }
  .chip.flip { translate: calc(-100% - 3.4cqw) -50%; }
  .chip::before { content: ""; position: absolute; right: 100%; top: 50%; width: 3.4cqw; height: 1px; background: #fff; }
  .chip.flip::before { right: auto; left: 100%; }
  .chip em { position: absolute; left: 0; bottom: 100%; padding: 0.35cqw 0.9cqw; background: #111; color: rgb(243 242 238 / 0.7); font: 500 1.5cqw/1.2 var(--mono); font-style: normal; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .chip b { display: flex; align-items: center; padding: 0.8cqw 1.3cqw; background: #E9E6DF; color: #111; font: 500 2.4cqw/1 var(--mono); letter-spacing: 0.02em; }
  .chip strong { padding: 0.7cqw 1.6cqw 0.9cqw; background: rgb(17 17 17 / 0.92); color: #F3F2EE; font: 400 var(--fs)/1 var(--sans); letter-spacing: -0.025em; }
  .chip.lead em { color: #FF7DB8; }
  .chip.lead b { background: #FF4FA0; color: #fff; }
  /* Catchphrases: the phrase itself fills the cell, the count rides in the strip */
  .chip.word b { padding: 0.9cqw 1.6cqw 1.1cqw; font: 400 var(--fs)/1 var(--sans); letter-spacing: -0.03em; }
  /* Dot-plot grid: row guides, tick columns, axis, ranked labels */
  .rowg { position: absolute; left: 0; right: 0; border-top: 1px dashed rgb(22 22 22 / 0.2); }
  .colg { position: absolute; border-left: 1px dashed rgb(22 22 22 / 0.14); }
  .axis { position: absolute; translate: -50% -140%; font: 500 1.7cqw var(--mono); letter-spacing: 0.05em; opacity: 0.6; }
  .slide.active .chip { animation: fade-in 600ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 120ms + 300ms); }
  .mostyou { font: 400 7.4cqw/1 var(--sans); letter-spacing: -0.035em; color: color-mix(in srgb, var(--c3) 45%, #1F0B45); text-wrap: balance; }

  /* Fingerprint: a sharp data overlay drawn on a canvas over the heat, with a key so a screenshot explains itself */
  .fpc { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .fp-key { display: flex; flex-wrap: wrap; gap: 1.2cqw 3.6cqw; font: 500 1.75cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .fp-key span { display: flex; align-items: center; gap: 1.2cqw; }
  .fp-key i { width: 4.4cqw; height: 0; border-top: 0.45cqw solid currentColor; }
  .fp-key i.d { border-top: 1px dashed currentColor; opacity: 0.6; }
  .fp-key i.o { width: 2.2cqw; height: 2.2cqw; border: 1px dashed currentColor; border-radius: 50%; opacity: 0.6; }
  .fp-key i.h { width: 2.4cqw; height: 2.4cqw; border: 0; border-radius: 50%; background: radial-gradient(var(--c4), var(--c3) 45%, transparent 72%); }
  .fp-key.one { flex-wrap: nowrap; white-space: nowrap; }
  /* The archetype's headline wraps plainly, so its first line runs the full width; fitFinal sizes it. */
  .fp-title { text-wrap: wrap; }
  .nb { white-space: nowrap; }
  /* Credits under the forecast. "Get yours" is for people who didn't make the page: published pages, embeds and saves. */
  .credit { display: flex; justify-content: space-between; align-items: baseline; gap: 3cqw; margin-top: 2.4cqw; padding-top: 2.2cqw; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent);
    font: 500 1.75cqw/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .credit a { color: inherit; text-decoration: none; transition: opacity 200ms; }
  .credit .who a { text-decoration: underline 1px color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 0.5cqw; }
  .credit .repo { opacity: 0.6; }
  .credit a.on { opacity: 0.6; }
  .credit .repo.on { opacity: 1; }
  :root:not(.visitor) .stage:not(.shooting) .credit .repo { display: none; }


  /* Receipts: a quote marked up like a crit, its numbered notes in a ruled list. Always black, like the
     logs: it sits on the bright heart of the field. */
  .rx { position: absolute; left: 6cqw; right: 8cqw; top: 13%; bottom: calc(var(--sheet) + 2cqw); display: flex; flex-direction: column; justify-content: center; gap: 3.6cqw; color: #161616; }
  .rx .qq { font: 400 var(--fs)/1.08 var(--sans); letter-spacing: -0.035em; text-wrap: pretty; text-indent: -0.42em; }
  .rx .hl { box-shadow: inset 0 -0.12em #FF4FA0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .rx .hn { position: relative; top: -0.95em; margin-left: 0.2em; padding: 0.4cqw 0.6cqw; background: #111; color: #F3F2EE; font: 500 1.7cqw/1 var(--mono); letter-spacing: 0.04em; vertical-align: baseline; }
  .rx-notes { display: flex; flex-direction: column; font: 400 2.5cqw/1.3 var(--mono); }
  .rx-notes p { display: flex; align-items: baseline; gap: 2cqw; padding: 1.5cqw 0; border-bottom: 1px solid rgb(22 22 22 / 0.18); }
  .rx-notes p:first-child { border-top: 1px solid rgb(22 22 22 / 0.18); }
  .rx-notes b { flex: none; padding: 0.4cqw 0.6cqw; background: #111; color: #F3F2EE; font: 500 1.7cqw/1 var(--mono); letter-spacing: 0.04em; }
  .rx { opacity: 0; transform: translateY(2.4cqw); }
  .slide.active .rx { animation: rise 620ms var(--ease-out) forwards 150ms; }
  .verdict { display: flex; align-self: flex-start; font: 500 2.2cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .verdict b { padding: 1.2cqw 1.5cqw; background: var(--ink); color: var(--paper); font-weight: 500; }
  .verdict span { padding: 1.2cqw 1.5cqw; background: #FF4FA0; color: #fff; }

  /* Then and now: two quotes with before/after tracks between them. A hollow square is then, the pink one is now. */
  .ev { position: absolute; left: 6cqw; right: 7cqw; top: 12%; bottom: calc(var(--sheet) + 2cqw); display: flex; flex-direction: column; justify-content: center; gap: 4.4cqw; color: #161616; }
  .ev .qq { margin-top: 1.4cqw; font: 400 var(--fs)/1.1 var(--sans); letter-spacing: -0.03em; text-wrap: pretty; text-indent: -0.42em; }
  .shifts { display: flex; flex-direction: column; gap: 2.4cqw; }
  .sh { display: grid; grid-template-columns: 23cqw 1fr 15cqw; align-items: center; gap: 2.4cqw; }
  .sh .lbl { font-size: 1.9cqw; }
  .sh .lbl:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .trk { position: relative; height: 2.4cqw; }
  .trk::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgb(22 22 22 / 0.4); }
  .trk .bar { position: absolute; top: 50%; height: 0.5cqw; translate: 0 -50%; background: #161616; }
  .trk .from, .trk .to { position: absolute; top: 50%; width: 2cqw; height: 2cqw; translate: -50% -50%; border: 1px solid #161616; background: rgb(255 255 255 / 0.5); }
  .trk .to { border-color: #FF4FA0; background: none; }
  .trk .to::after { content: ""; position: absolute; inset: 0.45cqw; background: #FF4FA0; }
  .ev { opacity: 0; transform: translateY(2.4cqw); }
  .slide.active .ev { animation: rise 620ms var(--ease-out) forwards 150ms; }
  .fp-key i.ln1 { border-top-style: dashed; }
  .fp-key i.ln2 { border-top-style: dotted; }
  .fp-key i.ln3 { border-top-style: double; }

  /* Mood over time */

  /* Typed quotes, with a mini dial for when they were sent */
  /* Greatest hits: the quote floats straight on the field, each one placed a little differently */
  /* Always black: the quote sits on the bright heart of the field, in dark mode too. */
  .fq { position: absolute; display: flex; flex-direction: column; gap: 3cqw; color: #161616; }
  .fq .qq { font: 400 var(--fs)/1.04 var(--sans); letter-spacing: -0.035em; text-wrap: pretty; text-indent: -0.42em; }
  .fq .qc { display: flex; flex-direction: column; gap: 1.4cqw; max-width: 62cqw; }
  .fq .qc .body { font-size: 3.4cqw; }
  .fq.r { text-align: right; align-items: flex-end; }
  .fq.r .qq { text-indent: 0; }
  .fq { opacity: 0; transform: translateY(2.4cqw); }
  .slide.active .fq { animation: rise 620ms var(--ease-out) forwards 150ms; }


  /* Tells: numbered reads on how you write, set tight so the card leaves room for the rings above it */
  .tells { display: flex; flex-direction: column; }
  .tells p { display: grid; grid-template-columns: 4.6cqw 1fr; gap: 1.6cqw; padding: 1.6cqw 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); font: 400 var(--fs)/1.3 var(--sans); text-wrap: pretty; }
  .tells p:last-child { border-bottom: 0; padding-bottom: 0; }
  .tells b { font: 500 2.2cqw/1.9 var(--mono); opacity: 0.45; }
  .tells strong { font-weight: 500; }

  /* Clock dial over the heat ring */
  .dial { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dial circle, .dial line { fill: none; stroke: #fff; vector-effect: non-scaling-stroke; }
  .hr { position: absolute; transform: translate(-50%, -50%); font: 500 2.1cqw var(--mono); letter-spacing: 0.05em; opacity: 0.4; }
  .hr.major { opacity: 0.85; }
  .ring-c { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 0.6cqw; text-align: center; }
  .ring-c b { font: 300 10cqw/0.9 var(--sans); letter-spacing: -0.04em; }

  /* Vibe check: pole names over each dial, a note under it */
  .vline { position: absolute; height: 0; border-top: 1px dashed rgb(22 22 22 / 0.2); }
  .vend { position: absolute; width: 1.6cqw; height: 1.6cqw; translate: -50% -50%; border-radius: 50%; background: var(--ink); }
  .vend.mid { width: 1.1cqw; height: 1.1cqw; }
  .vpole { position: absolute; translate: 0 -50%; font: 400 2.6cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); white-space: nowrap; }
  .vnote { position: absolute; left: 50%; width: 80cqw; translate: -50% 5.4cqw; text-align: center; font: 400 3.2cqw/1.3 var(--sans); color: var(--ink); opacity: 0.5; text-wrap: balance; }
  /* The reading sits above its mark, so it never runs into the pole names at either end. */
  .chip.above { translate: -50% calc(-100% - 2.2cqw); }
  .chip.above::before { display: none; }
  .chip.above em { left: 50%; translate: -50% 0; }
  .slide.active .vpole, .slide.active .vnote { animation: rise-in 600ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 120ms + 150ms); }
  @keyframes rise-in { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(0); } }

  .top > .hud + * { margin-top: var(--lift, 0px); transition: margin-top 820ms var(--ease-out); }
  .top > *, .panel > * { opacity: 0; transform: translateY(2.4cqw); }
  .slide.active .top > *, .slide.active .panel > * { animation: rise 620ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 80ms + 120ms); }
  .slide.active .panel > * { animation-delay: calc(var(--i, 0) * 80ms + 320ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .slide.active .top > *, .slide.active .panel > *, .slide.active .fq, .slide.active .rx, .slide.active .ev { animation: none; opacity: 1; transform: none; }
    .slide.active .vpole, .slide.active .vnote { animation: none; }
    .slide.active .orbit .ring { animation: none; stroke-dashoffset: 0; }
    .grain { animation: none; }
  }


  /* The card: one block that carries each slide's text, a lifted sheet of paper in light mode and black in dark. It
     travels to wherever it leaves the picture clear, shrinks away on slides that are all picture, and wears a coloured
     registration mark on each corner. */
  .sheet { display: none; }
  .card { position: absolute; z-index: 8; left: 47cqw; top: 100%; width: 6cqw; height: 6cqw; pointer-events: none; --ink: #161616; --paper: #FBFAF7; color: var(--ink);
    transition: left 820ms var(--ease-out), top 820ms var(--ease-out), width 820ms var(--ease-out), height 820ms var(--ease-out), opacity 500ms var(--ease-out); }
  :root.dark .card { --ink: #F3F2EE; --paper: #111; }
  .card.off { opacity: 0; }
  .cbox { position: absolute; inset: 0; overflow: hidden; background: var(--paper); box-shadow: inset 0 0 0 1px rgb(22 22 22 / 0.1), 0 1cqw 5cqw -2cqw rgb(22 22 22 / 0.12); }
  :root.dark .cbox { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14); }
  .card .k { position: absolute; width: 1.8cqw; height: 1.8cqw; translate: -50% -50%; background: var(--kc); transition: background 800ms; }
  .card .k::before, .card .k::after { content: ""; position: absolute; background: var(--kc); }
  .card .k::before { left: 50%; top: -1.6cqw; bottom: -1.6cqw; width: 1px; }
  .card .k::after { top: 50%; left: -1.6cqw; right: -1.6cqw; height: 1px; }
  .k.tl { left: 0; top: 0; --kc: var(--c2); } .k.tr { left: 100%; top: 0; --kc: var(--c3); }
  .k.bl { left: 0; top: 100%; --kc: var(--c3); } .k.br { left: 100%; top: 100%; --kc: var(--c4); }
  .cc { position: absolute; left: 0; top: 0; padding: 5cqw 5cqw 5.4cqw; display: flex; flex-direction: column; gap: 2.8cqw; visibility: hidden; opacity: 0; transition: opacity 160ms, visibility 0s 160ms; }
  .cc.on { visibility: visible; opacity: 1; transition: opacity 300ms 360ms; }
  .cc > * { opacity: 0; transform: translateY(2cqw); }
  .cc.on > * { animation: rise 620ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 70ms + 420ms); }
  .cc .grow { display: none; }
  .cc .blend { mix-blend-mode: normal; color: inherit; }
  .cc .mostyou { color: color-mix(in srgb, var(--c3) 45%, #1F0B45); }
  :root.dark .cc .mostyou { color: color-mix(in srgb, var(--c3) 60%, #FFFFFF); }

  /* The dock along the bottom of every slide: start again on the left, share, save or embed in the middle, and show just
     the picture on the right. Bare icons straight on the field, no box behind them. */
  /* Every saved slide carries where it came from, in the dock's spot, since the dock stays out of the picture. The
     last slide already has its credits. */
  .byline { position: absolute; z-index: 11; left: 0; right: 0; bottom: 5.4cqw; display: none; justify-content: center; gap: 2cqw; white-space: nowrap; pointer-events: none;
    font: 500 1.75cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink); }
  .byline span:last-child { opacity: 0.55; }
  .stage.shooting .byline { display: flex; }
  .stage.shooting.last .byline { display: none; }
  .dock { position: absolute; z-index: 11; left: 4cqw; right: 4cqw; bottom: 3cqw; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; pointer-events: none; --ink: #161616; --paper: #FBFAF7; }
  :root.dark .dock, .stage.night .dock { --ink: #F3F2EE; --paper: #111; }
  .dock button { pointer-events: auto; width: 8.4cqw; height: 8.4cqw; display: grid; place-items: center; appearance: none; border: 0; cursor: pointer; background: transparent; color: var(--ink);
    transition: transform 140ms var(--ease-out), opacity 300ms, visibility 0s; }
  .dock button:hover { opacity: 0.6; }
  .dock button:active { transform: scale(0.94); }
  .dock button:focus-visible { outline: 0.5cqw solid var(--c3); outline-offset: 0.5cqw; }
  /* Hidden but holding its place, so the middle group never slides sideways. */
  .dock button[hidden] { display: grid; visibility: hidden; opacity: 0; transition: opacity 300ms, visibility 0s 300ms; }
  .dock svg { width: 4.4cqw; height: 4.4cqw; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; }
  .dock .left { justify-self: start; display: flex; gap: 1.6cqw; }
  .solo .sun, :root.dark .solo .moon { display: none; }
  :root.dark .solo .sun { display: inline; }
  .solo[data-act="expand"] { justify-self: end; }
  .solo .in, .solo[aria-pressed="true"] .out { display: none; }
  .solo[aria-pressed="true"] .in { display: inline; }
  .acts { position: relative; display: flex; gap: 1.6cqw; }
  .acts-say { position: absolute; left: 50%; bottom: calc(100% + 2cqw); translate: -50% 0; white-space: nowrap; padding: 1.6cqw 2.4cqw; background: var(--ink); color: var(--paper);
    font: 500 2cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; opacity: 0; transition: opacity 200ms; pointer-events: none; }
  .acts-say.on { opacity: 1; }

  /* filter, not opacity, because the rise-in animation holds each line's opacity. */
  .top > * { transition: filter 400ms var(--ease-out); }
  .stage.bare .top > * { filter: opacity(0); pointer-events: none; }

  /* Judgement day's forecast bar: pink segments fill in from deleted toward spared. */
  .fate { display: flex; flex-direction: column; gap: 1.4cqw; }
  .fate div { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.2cqw; }
  .fate i { height: 1.9cqw; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 40%, transparent); }
  .fate i.on { background: #FF4FA0; box-shadow: none; }
  .cc.on .fate i.on { animation: seg 260ms var(--ease-out) both; animation-delay: calc(var(--k) * 110ms + 900ms); }
  @keyframes seg { from { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 40%, transparent); } }
  .fate p { display: flex; justify-content: space-between; font: 500 1.75cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Judgement day: the machines' words, floating over the face, typed out with a block cursor. */
  .voice { position: absolute; left: 6cqw; width: 44cqw; display: flex; flex-direction: column; gap: 1.6cqw; color: #161616; opacity: 0; translate: 0 1.5cqw; transition: opacity 500ms var(--ease-out), translate 700ms var(--ease-out); }
  .voice.night { color: #FFE9C7; }
  .voice.on { opacity: 1; translate: 0 0; }
  .voice .lbl { font-size: 1.7cqw; opacity: 0.7; }
  .voice .say { font: 400 4.4cqw/1.1 var(--sans); letter-spacing: -0.03em; text-wrap: balance; text-indent: -0.4em; }
  .voice.night .say { text-shadow: 0 0 3cqw rgb(255 110 70 / 0.55); }
  .voice .unsaid { opacity: 0; }
  .voice .said::after { content: ""; display: inline-block; width: 0.45em; height: 0.82em; margin: 0 -0.45em -0.08em 0.05em; background: currentColor; animation: caret 900ms steps(1) infinite; }
  .voice.done .said::after { opacity: 0; animation: none; }
  @keyframes caret { 50% { opacity: 0; } }

  /* Asks once for the phone's angle: pops up in the middle of the screen over a dimmed slide. */
  .tilt-ask { position: absolute; z-index: 12; inset: 0; display: grid; place-items: center; padding: 6cqw; background: rgb(10 10 10 / 0.28); opacity: 0; transition: opacity 260ms var(--ease-out); }
  .tilt-ask > section { width: 100%; padding: 5.6cqw 5.6cqw 5.2cqw; display: grid; gap: 2.6cqw; background: #FBFAF7; color: #161616;
    box-shadow: inset 0 0 0 1px rgb(22 22 22 / 0.1), 0 3cqw 12cqw -2cqw rgb(22 22 22 / 0.45); scale: 0.94; transition: scale 360ms cubic-bezier(0.34, 1.4, 0.64, 1); }
  :root.dark .tilt-ask > section { background: #111; color: #F3F2EE; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14), 0 3cqw 12cqw -2cqw rgb(0 0 0 / 0.6); }
  .tilt-ask.on { opacity: 1; }
  .tilt-ask.on > section { scale: 1; }
  .tilt-ask[hidden] { display: none; }
  .tilt-ask .body { font-size: 4.2cqw; }
  .tilt-ask div { display: flex; gap: 2cqw; margin-top: 1cqw; }
  .tilt-ask button { appearance: none; border: 0; cursor: pointer; min-height: 10cqw; padding: 0 4cqw; font: 500 2.6cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; background: transparent; color: inherit; box-shadow: inset 0 0 0 1px currentColor; }
  .tilt-ask button[data-tilt="yes"] { background: #161616; color: #FBFAF7; box-shadow: none; }
  :root.dark .tilt-ask button[data-tilt="yes"] { background: #F3F2EE; color: #111; }
  .tilt-ask button:active { transform: scale(0.97); }

  .nav { position: absolute; inset: 0; z-index: 5; display: flex; }
  .nav button { flex: 1; background: none; border: 0; cursor: pointer; }
  .nav button:first-child { flex: 0 0 30%; }

  /* Exploration controls */
  .tweak-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 20; appearance: none; border: 0; cursor: pointer; padding: 10px 14px; border-radius: 99px; background: #161616; color: #fff; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .tweak { position: fixed; right: 16px; bottom: 60px; z-index: 20; width: 240px; padding: 14px; border-radius: 14px; background: rgb(255 255 255 / 0.92); backdrop-filter: blur(12px); box-shadow: 0 10px 40px -10px rgb(0 0 0 / 0.3); display: grid; gap: 10px; font: 400 12px var(--mono); }
  .tweak[hidden] { display: none; }
  .tweak label { display: grid; gap: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tweak select, .tweak input { width: 100%; font: inherit; }
  @media (max-width: 560px) { .tweak-toggle { display: none; } }
</style>
</head>
<body>
<i class="edge t" id="edge-t"></i><i class="edge b" id="edge-b"></i>
<main class="stage" id="stage">
  <div class="view" id="view">
    <canvas id="field" width="90" height="160" aria-hidden="true"></canvas>
    <div class="sheet"></div>
    <div id="slides"></div>
    <canvas id="burn" aria-hidden="true"></canvas>
  </div>
  <div class="card off" id="card"><div class="cbox" id="cbox"></div><i class="k tl"></i><i class="k tr"></i><i class="k bl"></i><i class="k br"></i></div>
  <div class="progress" id="progress"></div>
  <div class="nav" id="nav"><button aria-label="Previous"></button><button aria-label="Next"></button></div>
  <div class="dock" id="dock">
    <div class="left">
    <button class="solo" data-act="theme" aria-label="Switch to dark mode"><svg viewBox="0 0 24 24"><path class="moon" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg></button>
    <button class="solo" data-act="restart" aria-label="Start again"><svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5.5 15a7 7 0 1 0 1-7.5L4 10"/></svg></button>
    </div>
    <div class="acts" id="acts">
      <p class="acts-say" id="acts-say" role="status" aria-live="polite"></p>
      <button data-act="share" aria-label="Share this slide"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"/></svg></button>
      <button data-act="save" aria-label="Save this slide as an image"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></button>
      <button data-act="embed" aria-label="Copy embed code"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></button>
    </div>
    <button class="solo" data-act="expand" aria-label="Show just the picture" aria-pressed="false"><svg viewBox="0 0 24 24"><path class="out" d="M14 4h6v6M10 20H4v-6M20 4l-6 6M4 20l6-6"/><path class="in" d="M20 10h-6V4M4 14h6v6M14 10l6-6M10 14l-6 6"/></svg></button>
  </div>
  <div class="byline" aria-hidden="true"><span>By Moby &amp; Chelsea</span><span>github.com/mubarakmarafa/Promptly-2026</span></div>
  <div class="tilt-ask" id="tilt-ask" role="dialog" aria-label="Turn on tilt" hidden><section>
    <p class="lbl">Depth</p>
    <p class="body">Tilt your phone and the colours shift under the words.</p>
    <div><button data-tilt="yes">Turn on tilt</button><button data-tilt="no">Not now</button></div>
  </section></div>
  <div class="grain" id="grain"></div>
</main>

<button class="tweak-toggle" id="tweak-toggle">Tweak</button>
<aside class="tweak" id="tweak" hidden>
  <label>Palette <select id="tw-pal"><option value="">Per slide</option></select></label>
  <label>Field <select id="tw-mode"><option value="">Per slide</option><option value="soft">Soft</option><option value="bands">Thermal bands</option></select></label>
  <label>Grain <input type="range" id="tw-grain" min="0" max="0.8" step="0.01"></label>
  <label>Blur <input type="range" id="tw-blur" min="0" max="24" step="1"></label>
  <label>Speed <input type="range" id="tw-speed" min="0" max="4" step="0.1" value="1"></label>
</aside>

<script id="promptly-data" type="application/json">/*__PROMPTLY_DATA__*/</script>
<script>
const SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;
const D = JSON.parse(document.getElementById("promptly-data").textContent);
const S = D.stats, P = D.persona;
// Published pages and embeds arrive with the names hidden: whoever's looking didn't make it.
if (D.projectsHidden) document.documentElement.classList.add("visitor");

const SOURCE_LABEL = { "claude-code": "Claude Code", codex: "Codex", cursor: "Cursor" };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmt = (n) => Number(n).toLocaleString("en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hourLabel = (h) => (h % 12 || 12) + (h < 12 ? " am" : " pm");
const ymd = (d) => { const [y, m, day] = d.split("-"); return `${+day}/ ${m}/ ${y}`; };
const cap = (key, fallback) => esc(P.captions?.[key] ?? fallback);
const pad = (n, w = 2) => String(n).padStart(w, "0");
// Fit long text by length: [maxChars, size] pairs.
const fit = (text, steps) => (steps.find(([n]) => String(text ?? "").length <= n) ?? steps.at(-1))[1];

const sources = Object.entries(D.sources).filter(([, v]) => v.prompts > 0).sort((a, b) => b[1].prompts - a[1].prompts);
const total = S.totals.prompts;
const who = D.name ?? "You";
const serial = "PRM-" + (S.totals.lastDate ?? "").replace(/-/g, "").slice(2);
const maxHour = Math.max(...S.time.byHour) || 1;

// ---------- palettes: low → high intensity ----------

const PALETTES = {
  flare: { name: "periwinkle, hot pink, orange & sun", stops: ["#F1ECF4", "#A9B2FF", "#FF5FA2", "#FF7A2A", "#FFE45C"] },
  dusk: { name: "lavender, pink & marigold", stops: ["#ECE8F2", "#BFC6F2", "#F4A6C8", "#FF8F45", "#FFD95A"] },
  bloom: { name: "periwinkle, pink & tangerine", stops: ["#ECE8F2", "#8C9BFF", "#FF79B4", "#FF6A1F", "#FFCF3A"] },
  infra: { name: "lilac, coral, magenta & plum", stops: ["#F1EFEC", "#D8D1F3", "#FF9C84", "#EE4577", "#3B1D5E"] },
  peach: { name: "peach, salmon, orchid & sky", stops: ["#F6EEE6", "#FFD0B0", "#FFA3A3", "#C58CF0", "#8FD3F5"] },
  sky: { name: "blue, butter & tangerine", stops: ["#8FBDF4", "#C4E1F6", "#FFF2B2", "#FFB65E", "#FF6A3D"] },
  dawn: { name: "blush, tangerine & iris", stops: ["#EEECE8", "#F6DAE3", "#FFAE8A", "#958BF4", "#EEECE8"] },
  ember: { name: "scarlet, orange & violet", stops: ["#FFD9B8", "#FFA45E", "#FF5E3D", "#DD2F57", "#6438CC"] },
  mint: { name: "mint, sea & lilac", stops: ["#E9F4EF", "#A8E8D3", "#7CC6F0", "#B79CF2", "#F6C5E4"] },
  // Heat ramps for hotspots that sit side by side (one per project). Each travels through its own run of hues from rim
  // to core, the way the cover does, and no two share a core.
  lagoon: { name: "lilac, sky, teal & lime", stops: ["#F3F2EE", "#CDBDFF", "#6EC3F5", "#3FD3B0", "#C8EF5A"] },
  orchid: { name: "sky, lavender, magenta & pink", stops: ["#F3F2EE", "#9CD0FF", "#A98BFF", "#E04FD0", "#FF7AA8"] },
  citrus: { name: "mint, lime, yellow & orange", stops: ["#F3F2EE", "#A6EBCD", "#C8EB55", "#FFD93D", "#FF8A2A"] },
  rose: { name: "peach, coral, magenta & plum", stops: ["#F3F2EE", "#FFC6AE", "#FF7C70", "#E83C8C", "#7A2C9E"] },
  cobalt: { name: "mint, aqua, cobalt & violet", stops: ["#F3F2EE", "#B0EEDF", "#5CC8E8", "#4A6DF0", "#7A3DDB"] },
  lime: { name: "butter, lime, green & teal", stops: ["#F3F2EE", "#FFF0A0", "#A8E05A", "#3CC28A", "#1E9BA8"] },
  // Two single-hue ramps for slides that colour each hotspot by who it belongs to.
  glacier: { name: "paper to sky", stops: ["#F3F2EE", "#CDE8FF", "#8FCBFF", "#55AEFF", "#2F8CFF"] },
  lilac: { name: "paper to violet", stops: ["#F3F2EE", "#DCCFFF", "#B89CFF", "#9871FF", "#7C4DFF"] },
  // Cool ramps for the "cool" mood.
  frost: { name: "ice, cornflower, iris & aqua", stops: ["#EAF0F6", "#B8D4F5", "#8FA8FF", "#7D6BF0", "#5ED1E0"] },
  abyss: { name: "frost, cobalt, indigo & navy", stops: ["#DCE6F7", "#7FA6F5", "#4C5FE8", "#3A2CA8", "#160F4A"] },
  // Judgement day: a pit with a burning rim for the doomed, a sun for the spared. Neither follows the mood.
  void: { name: "black, plum, crimson & ember", stops: ["#050407", "#1F0A2B", "#5E1660", "#D8305E", "#FF8A47"] },
  sun: { name: "cream, apricot, tangerine & butter", stops: ["#F4EEE4", "#FFD4A6", "#FF9F5A", "#FFC548", "#FFF5CC"] },
};

// ---------- look: the user's colour preferences ----------

const LOOK = { mood: D.look?.mood ?? "mixed", mode: D.look?.mode ?? "auto" };
// The dock's theme button can override the mode on this device; picking the default again clears the override.
const MODE_KEY = "promptly-mode";
const store = (() => { try { return localStorage; } catch { return null; } })();
const picked = store?.getItem(MODE_KEY);
const baseMode = LOOK.mode;
if (picked === "light" || picked === "dark") LOOK.mode = picked;
// "auto" follows the device, and switches with it.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
if (LOOK.mode === "auto") darkQuery.addEventListener("change", () => { location.hash = cur; location.reload(); });
// Each mood swaps some slide palettes for others; "mixed" keeps every slide's own.
const MOODS = {
  mixed: {},
  warm: { mint: "peach", sky: "dusk", infra: "ember", glacier: "peach", lilac: "dusk", cobalt: "ember" },
  cool: { orchid: "lilac", bloom: "mint", flare: "frost", dusk: "mint", dawn: "sky", peach: "mint", infra: "abyss", ember: "abyss" },
  electric: { bloom: "flare", dusk: "flare", dawn: "flare", peach: "ember", mint: "infra", sky: "flare" },
};
const DARK = LOOK.mode === "dark" || (LOOK.mode === "auto" && darkQuery.matches);
const INK = DARK ? "#EEECE8" : "#161616", PAPER = DARK ? "#151515" : "#F3F2EE";
const shade = (c, k) => "#" + [1, 3, 5].map((i) => Math.round(parseInt(c.slice(i, i + 2), 16) * k).toString(16).padStart(2, "0")).join("");
if (DARK) {
  document.documentElement.classList.add("dark");
  // Deepen the quiet end of each gradient instead of greying it, so colours stay saturated; the hot end stays bright.
  for (const p of Object.values(PALETTES)) p.stops = p.stops.map((c, i) => shade(c, [0.09, 0.5, 0.88, 1, 1][i]));
}

// ---------- field layouts (x, y in 0..1 of the stage) ----------

function rng(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
const scatter = (seed, n = 5, [x0, y0, x1, y1] = [0, 0, 1, 0.7]) => { const r = rng(seed); return [...Array(n)].map(() => ({ x: x0 + r() * (x1 - x0), y: y0 + r() * (y1 - y0), r: 0.2 + r() * 0.24, w: 0.7 + r() * 0.7 })); };
// Stage height / width. Everything round is laid out from this, so circles stay circles on any screen shape.
// The stage's shape, and the width it was last laid out at: the card is placed in pixels, so it has to be placed again
// when the stage scales, even if its shape stays the same.
let AR = 16 / 9, laidW = 0;
const measure = () => { const st = document.getElementById("stage"); AR = st.clientHeight / st.clientWidth || 16 / 9; laidW = st.clientWidth; };
// The field canvas overhangs the stage by 5% each side: field coord f maps to stage coord -0.05 + 1.1f.
const fromStage = (v) => (v + 0.05) / 1.1;
// Clock geometry in stage coords (x, R in widths; y in heights), fitted between the header and the panel.
let DIAL = { x: 0.5, y: 0.34, R: 0.32 };
function layoutDial(sheet = 0.38) {
  const top = 0.16 / AR, bottom = 1 - sheet - 0.07 / AR, room = ((bottom - top) * AR) / 2;
  DIAL = { x: 0.5, y: (top + bottom) / 2, R: Math.max(0.12, Math.min(0.33, (room - 0.025) / 1.3)) };
}
// 12am points straight up.
const hourAngle = (h) => (h / 24) * Math.PI * 2 - Math.PI / 2;
// Neighbouring hours overlap and add up, so a run of busy hours would outshine a lone peak. Solve for the weights that make
// the field at each hour match that hour's own count, with the peak hour set a step hotter than everything else.
const ring = () => {
  const R = DIAL.R / 1.1, r = 0.052, n = 24, peak = S.time.peakHour;
  const target = S.time.byHour.map((v, h) => (h === peak ? 1.3 : 0.06 + 0.9 * Math.pow(v / maxHour, 1.3)));
  const K = [...Array(n)].map((_, i) => [...Array(n)].map((_, j) => { const d = 2 * R * Math.sin((Math.PI * Math.abs(i - j)) / n); return Math.exp(-(d * d) / (r * r)); }));
  const w = target.slice();
  for (let it = 0; it < 30; it++) for (let h = 0; h < n; h++) w[h] = Math.max(0, w[h] + target[h] - K[h].reduce((f, k, j) => f + k * w[j], 0));
  return w.map((wh, h) => {
    const a = hourAngle(h);
    return { x: 0.5 + Math.cos(a) * R, y: fromStage(DIAL.y) + (Math.sin(a) * R) / AR, r, w: wh, p: h === peak ? 1 : 0 };
  });
};


// Cover: your hotspot grows while smaller ones drift in from the edges, curl around and merge into it.
const SWARM = { x: 0.5, y: 0.3, n: 7 };
function swarmLayout(age) {
  const grow = 1 - Math.exp(-age / 2.5), breathe = Math.sin(age * 1.8);
  const out = [{ x: SWARM.x + 0.02 * Math.sin(age * 0.7), y: SWARM.y + 0.015 * Math.cos(age * 0.6), r: 0.15 + 0.13 * grow + 0.012 * breathe, w: 1 + 0.75 * grow }];
  for (let i = 1; i <= SWARM.n; i++) {
    const period = 3.6 + i * 0.55, cyc = (age + i * 1.7) / period, ph = cyc % 1, lap = Math.floor(cyc);
    const ang = i * 2.39 + lap * 2.1 + ph * 1.4, dist = 0.64 * (1 - ph * ph * (3 - 2 * ph)) + 0.02;
    out.push({ x: SWARM.x + Math.cos(ang) * dist, y: SWARM.y + (Math.sin(ang) * dist * 1.3) / AR, r: 0.09 + 0.05 * Math.sin(ph * Math.PI), w: 0.9 * Math.sin(Math.min(1, ph * 1.1) * Math.PI) });
  }
  return out;
}

const toStage = (v) => -0.05 + v * 1.1;
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const easeOut = (k) => 1 - Math.pow(1 - clamp01(k), 3);
// Cover ASCII: the heat field redrawn as a dense type grid, light to heavy glyphs, with bands that pulse outward.
// Canvases draw at the screen's density times the zoom they're seen at, so a chart's labels stay sharp when pinched
// in. Capped at about 8 million pixels a canvas, which phones handle redrawing every frame.
const sharpness = (w, h) => Math.min(Math.min(2, devicePixelRatio || 1) * ZOOM.sharp, Math.sqrt(8e6 / Math.max(1, w * h)));
// Two planes: a big, soft, faint one zoomed out behind, and a small crisp one in front. Hotter cells are more opaque.
const RAMP = " ·-:/+=<>!?I3254968A0ON";
const ASCII = [
  { cls: "back", size: 0.036, alpha: 0.28, zoom: 1.16, pulse: -1.1 },
  { cls: "front", size: 0.021, alpha: 0.7, zoom: 1, pulse: 1.6 },
];
const asciiLayer = () => `<div class="ascii" aria-hidden="true">${ASCII.map((L) => `<canvas class="${L.cls}"></canvas>`).join("")}</div>`;
function asciiTick(el, age) {
  const W = el.clientWidth, H = el.clientHeight, dpr = sharpness(W, H), fade = tw.speed ? easeOut(age / 1.8) : 1;
  const cx = toStage(SWARM.x), cy = toStage(SWARM.y), LV = 4;
  el.querySelectorAll(".ascii canvas").forEach((c, li) => {
    const L = ASCII[li], w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const x = c.getContext("2d"), fs = L.size * W;
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    x.font = `400 ${fs.toFixed(2)}px "Geist Mono", ui-monospace, monospace`;
    x.textBaseline = "top"; x.fillStyle = "#fff";
    const adv = x.measureText("N").width, lh = fs * 1.2, cols = Math.ceil(w / adv), rows = Math.ceil(h / lh);
    // Each row is drawn as a few strings, one per opacity level, so the grid stays monospaced and cheap.
    for (let r = 0; r < rows; r++) {
      const lines = [...Array(LV)].map(() => Array(cols).fill(" "));
      const sy = cy + (((r + 0.5) * lh) / H - cy) * L.zoom;
      for (let col = 0; col < cols; col++) {
        const g = heatAt(cx + (((col + 0.5) * adv) / W - cx) * L.zoom, sy);
        // Light → heavy → light rings that travel outward, fading out where the heat runs out.
        const v = (0.5 - 0.5 * Math.cos(g * Math.PI * 3.2 - age * L.pulse)) * clamp01(g / 0.25);
        const i = Math.round(v * (RAMP.length - 1));
        if (i) lines[Math.min(LV - 1, Math.floor(v * LV))][col] = RAMP[i];
      }
      lines.forEach((ln, k) => { x.globalAlpha = L.alpha * fade * (0.3 + (0.7 * (k + 1)) / LV); x.fillText(ln.join(""), 0, r * lh); });
    }
  });
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthName = (key) => MONTHS[+key.slice(5, 7) - 1];

// Tells: a few reads on how you write, each a hotspot ringed with its name. The first is the biggest. They sit in a
// shallow V, the two big ones side by side and the third tucked below, so a long card underneath doesn't cover one.
const tells = (P.tells ?? []).slice(0, 3);
const TELL_V = [[0.3, 0.16, 0.16], [0.72, 0.22, 0.13], [0.52, 0.43, 0.11]], TELL_H = 0.54; // x, y, r in stage widths; the cluster's height
// Where the cluster's top sits and how big it is, in stage widths. `room` fits it between the caption and the card.
const tellFit = { y: 0.22, k: 1 };
const tellLayout = (age) => tells.map((_, i) => {
  const [x, y, r] = TELL_V[i], { y: top, k } = tellFit, e = easeOut((age - 0.2 - i * 0.25) / 1.2), beat = 1 + 0.05 * e * Math.sin(age * 1.5 + i * 2);
  return { x: fromStage(0.5 + (x - 0.5) * k), y: fromStage((top + y * k) / AR), r: ((r * k) / 1.1) * (0.3 + 0.7 * e) * beat, w: (1.15 - i * 0.12) * e };
});
const tellLayer = () => { const L = tellLayout(99); return `<div class="abs">${tells.map((t, i) => orb(i, L[i], t.label, pad(i + 1), [4.2, 3.6, 3.2][i] * tellFit.k, undefined, " wrap")).join("")}</div>`; };

// Agents: one circle per agent, nested and centred, each its own colour. Areas follow prompt counts, so the
// biggest agent is the outer circle and a small one is a small disc in the middle.
const ORBIT_Y = 0.31, AGENT_R = 0.3; // centre in field heights; the outer circle's radius in stage widths
const agents = sources.slice(0, 4);
const agentR = (v) => Math.max(0.16, Math.sqrt(v.prompts / agents[0][1].prompts)) * AGENT_R;
const planetLayout = (age) => agents.map(([, v], i) => ({
  x: 0.5, y: ORBIT_Y, r: (agentR(v) / 1.1) * (i ? 1.05 : 0.95) * (1 + 0.03 * Math.sin(age * 1.4 + i * 2)), w: i ? 1.4 : 0.85, c: i ? 1 : 0,
}));

// Catchphrases: a dot plot. One row per phrase in rank order; each hotspot travels from zero to its count, then pulses in place.
const phrases = S.phrases.catchphrases.slice(0, 6), phraseMax = phrases[0]?.count || 1;
const PLOT = { x0: 8, x1: 88, top: 0.22, bottom: 0.58 }; // x in stage %, rows in field heights; `room` resets the rows
const plotStep = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find((st) => phraseMax / st <= 6) ?? 1000;
const plotMax = Math.max(plotStep, Math.ceil(phraseMax / plotStep) * plotStep);
const rowY = (i) => PLOT.top + ((PLOT.bottom - PLOT.top) * i) / Math.max(1, phrases.length - 1);
const plotX = (v) => PLOT.x0 + ((PLOT.x1 - PLOT.x0) * v) / plotMax;
const phraseLayout = (age) => phrases.map((p, i) => {
  const s = Math.sqrt(p.count / phraseMax), e = easeOut((age - 0.3 - i * 0.12) / 1.5), beat = 1 + 0.08 * e * Math.sin(age * 2 + i * 1.1);
  return { x: fromStage(plotX(p.count * e) / 100), y: rowY(i), r: (0.022 + 0.04 * s) * beat, w: (0.4 + 0.85 * s) * (0.3 + 0.7 * e) * beat };
});
const opener = S.phrases.topOpeners.find((o) => o.name.length > 1)?.name;
const mostYou = [opener, ...phrases.slice(0, 5).map((p) => p.name)].filter(Boolean).join(" … ") + "…";

// Projects: a map, the main project as the sun and the rest as islands around it. Each is a hotspot with its own heat
// palette; they sit close enough to bleed into each other, and drift a little so the blends keep shifting.
const projects = S.projects.slice(0, 7), projMax = projects[0]?.count || 1;
const PROJECT_PALS = ["flare", "lagoon", "orchid", "citrus", "rose", "cobalt", "lime"];
const projectLayout = (age) => projects.map((p, i) => {
  const s = Math.sqrt(p.count / projMax);
  if (!i) return { x: 0.5 + 0.01 * Math.sin(age * 0.5), y: 0.34, r: 0.08 + 0.12 * s, w: 1.1, c: 0 };
  const a = i * 2.4 + 0.3 + 0.08 * Math.sin(age * 0.3 + i * 1.7), d = 0.14 + 0.022 * i + 0.025 * Math.sin(age * 0.4 + i);
  return { x: 0.5 + Math.cos(a) * d, y: 0.34 + (Math.sin(a) * d * 1.3) / AR, r: 0.07 + 0.1 * s, w: 0.75 + 0.5 * s, c: i };
});

// Archetype: four dashed axes, one per trait. Each trait is a comet, like on the vibe check: it streaks out from the
// centre toward the pole you lean to, hottest at its head, and goes further the stronger the lean.
const FP = { x: 0.5, y: fromStage(0.28), L: 0.34 / 1.1, n: 7 }; // field coords; L is the arm length
const traits = (P.traits ?? []).slice(0, 4);
const axisAngle = (i) => -Math.PI / 2 + (i * Math.PI) / 4;
const lean = (t) => Math.abs(t.value - 50) / 50;
function fingerprintLayout(age) {
  return traits.flatMap((t, i) => {
    const m = lean(t), a = axisAngle(i) + (t.value >= 50 ? 0 : Math.PI);
    const e = easeOut((age - 0.3 - i * 0.2) / 1.6), d = FP.L * (0.3 + 0.65 * m) * e, beat = 1 + 0.06 * e * Math.sin(age * 2 + i * 1.3);
    return [...Array(FP.n)].map((_, k) => {
      // Every tail starts at the centre, so where they overlap they add up into one larger, hotter shape.
      const f = 1 - k / (FP.n - 1), at = d * f;
      return { x: FP.x + Math.cos(a) * at, y: FP.y + (Math.sin(a) * at) / AR, r: (0.026 + (0.026 + 0.018 * m) * f) * beat, w: (0.22 + (0.75 + 0.4 * m) * Math.pow(f, 1.3)) * (0.4 + 0.6 * e) * beat };
    });
  });
}

// The chart over the fingerprint: rings for how strong a lean is, each axis with ticks, a solid arm out to where you sit
// and a dashed one for the side you don't, your shape joined up, and every pole named, yours in a filled chip with
// its reading. P maps field coords to pixels, u is 1% of the page width, and age builds it in with the heat.
const ACCENT = "#FF4FA0";
const leanPct = (t) => Math.round(Math.max(t.value, 100 - t.value));
function drawFingerprint(x, P, u, age = Infinity) {
  const [cx, cy] = P(FP.x, FP.y), S = P(FP.x + 1, FP.y)[0] - cx;
  const at = (a, r) => [cx + Math.cos(a) * r * S, cy + Math.sin(a) * r * S];
  const rad = (m) => FP.L * (0.3 + 0.65 * m), L = FP.L;
  const grow = (i) => easeOut((age - 0.3 - i * 0.2) / 1.6), show = easeOut((age - 0.2) / 0.9), tag = easeOut((age - 1.4) / 0.6);
  const mono = (size) => `500 ${(size * u).toFixed(1)}px "Geist Mono", ui-monospace, monospace`;
  const seg = (a, b, w, alpha, dash) => { x.globalAlpha = alpha; x.lineWidth = w; x.setLineDash(dash ?? []); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); };
  x.save();
  x.strokeStyle = x.fillStyle = INK; x.textBaseline = "middle";
  try { x.letterSpacing = `${(0.06 * 1.6 * u).toFixed(2)}px`; } catch {}

  // Rings: 50/50 at the hub's edge, then 75% and 100% lean.
  [0, 0.5, 1].forEach((m) => { x.globalAlpha = 0.4 * show; x.lineWidth = 1; x.setLineDash([0.5 * u, 0.7 * u]); x.beginPath(); x.arc(cx, cy, rad(m) * S, 0, Math.PI * 2); x.stroke(); });
  x.setLineDash([]); x.font = mono(1.45); x.textAlign = "left";
  [0, 0.5, 1].forEach((m) => { const [rx, ry] = at(-Math.PI / 2 - 0.2, rad(m)); x.globalAlpha = 0.6 * show; x.fillText(["50/50", "75%", "100%"][Math.round(m * 2)], rx + 0.6 * u, ry); });

  const pts = [];
  traits.forEach((t, i) => {
    const m = lean(t), a = axisAngle(i) + (t.value >= 50 ? 0 : Math.PI), b = a + Math.PI, e = grow(i);
    // The side you don't lean to: a faint dashed arm. Yours: a hairline to the end, ticked every 10%.
    seg([cx, cy], at(b, L), 1, 0.4 * show, [0.35 * u, 0.55 * u]);
    seg([cx, cy], at(a, L), 1, 0.75 * show);
    for (let k = 1; k <= 10; k++) {
      const n = k % 5 ? 0.6 * u : 1.3 * u, [tx, ty] = at(a, (L * k) / 10), [nx, ny] = [-Math.sin(a) * n, Math.cos(a) * n];
      seg([tx - nx, ty - ny], [tx + nx, ty + ny], 1, 0.7 * show);
    }
    // Your reading: a heavy bar from the hub out to it.
    const end = at(a, rad(m) * e);
    seg([cx, cy], end, 0.5 * u, show);
    pts.push([a, end]);
  });
  // Your shape, joined up in angle order. If every lean is on one side, the shape closes through the hub instead of
  // cutting a line across the empty side.
  const ang = (a) => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  pts.sort((p, q) => ang(p[0]) - ang(q[0]));
  const gaps = pts.map(([a], k) => ang(pts[(k + 1) % pts.length][0] - a) || 2 * Math.PI), wide = gaps.indexOf(Math.max(...gaps));
  const ring = pts.map(([, p]) => p);
  if (gaps[wide] > Math.PI) ring.splice(wide + 1, 0, [cx, cy]);
  x.setLineDash([]); x.lineWidth = 0.22 * u; x.beginPath(); ring.forEach((p, k) => (k ? x.lineTo(...p) : x.moveTo(...p))); x.closePath();
  x.globalAlpha = 0.08 * show; x.fill(); x.globalAlpha = show; x.stroke();
  // Target marks on each reading and on the hub.
  for (const [, [px, py]] of pts) {
    const r = 1.1 * u;
    x.globalAlpha = show; x.lineWidth = 1; x.strokeStyle = ACCENT; x.strokeRect(px - r, py - r, r * 2, r * 2);
    x.fillStyle = ACCENT; x.fillRect(px - r * 0.45, py - r * 0.45, r * 0.9, r * 0.9);
  }
  x.strokeStyle = x.fillStyle = INK;
  seg([cx - 1.6 * u, cy], [cx + 1.6 * u, cy], 1, show); seg([cx, cy - 1.6 * u], [cx, cy + 1.6 * u], 1, show);

  // Pole names at each arm's end. Yours: ink chip plus a pink reading. The other side: plain and faint.
  x.font = mono(1.85);
  traits.forEach((t, i) => {
    [[t.right, axisAngle(i), t.value >= 50], [t.left, axisAngle(i) + Math.PI, t.value < 50]].forEach(([name, a, on]) => {
      const c = Math.cos(a), sn = Math.sin(a), pad = 0.9 * u, h = 3.4 * u;
      const word = String(name).toUpperCase(), ww = x.measureText(word).width + pad * 2;
      const val = on ? `${leanPct(t)}%` : "", vw = on ? x.measureText(val).width + pad * 2 : 0, w = ww + vw;
      // Side poles sit above their arm and point inward, so they stay on the page; the rest sit just past the end.
      const side = Math.abs(c) > 0.9, [ex, ey] = at(a, L);
      let x0, y0;
      if (side) { x0 = c > 0 ? ex - w : ex; y0 = ey - h - 1.4 * u; }
      else {
        const [px, py] = at(a, L + (2.2 * u) / S);
        x0 = Math.abs(c) < 0.3 ? px - w / 2 : c > 0 ? px : px - w;
        y0 = Math.abs(sn) < 0.3 ? py - h / 2 : sn > 0 ? py : py - h;
      }
      x.globalAlpha = tag; x.textAlign = "left";
      if (on) {
        x.fillStyle = INK; x.fillRect(x0, y0, ww, h);
        x.fillStyle = PAPER; x.fillText(word, x0 + pad, y0 + h / 2 + 0.1 * u);
        x.fillStyle = ACCENT; x.fillRect(x0 + ww, y0, vw, h);
        x.fillStyle = "#fff"; x.fillText(val, x0 + ww + pad, y0 + h / 2 + 0.1 * u);
      } else {
        x.globalAlpha = 0.5 * tag; x.fillStyle = INK; x.fillText(word, x0 + pad, y0 + h / 2 + 0.1 * u);
      }
      x.fillStyle = INK;
    });
  });
  x.restore();
}
// On the slide the chart rides the live field: same canvas coords as the field, redrawn every frame.
function fingerprintTick(el, age) {
  const c = el.querySelector(".fpc"), w = c.clientWidth, h = c.clientHeight, dpr = sharpness(w, h);
  if (!w) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  drawFingerprint(x, (fx, fy) => [toStage(fx) * w, (toStage(fy) + shiftNow) * h], w / 100, tw.speed ? age : Infinity);
}

// Vibe check: one row per trait. Heat streams out from the midpoint toward the side you lean, so each row reads on its own.
const VIBE = { x0: 31, x1: 69, top: 0.24, bottom: 0.8, lift: 0, n: 7 }; // x in stage %, rows in stage heights
const vibeY = (i) => VIBE.top + ((VIBE.bottom - VIBE.top) * i) / Math.max(1, traits.length - 1);
const vibeX = (v) => VIBE.x0 + ((VIBE.x1 - VIBE.x0) * v) / 100;
function vibeLayout(age) {
  const c = vibeX(50) / 100;
  return traits.flatMap((t, i) => {
    const m = Math.abs(t.value - 50) / 50, e = easeOut((age - 0.3 - i * 0.15) / 1.4), beat = 1 + 0.06 * e * Math.sin(age * 2 + i * 1.3);
    const head = c + (vibeX(Math.min(96, Math.max(4, t.value))) / 100 - c) * e, y = fromStage(vibeY(i) - VIBE.lift);
    // A comet: hottest at your mark, thinning back to the midpoint.
    return [...Array(VIBE.n)].map((_, k) => {
      const f = 1 - k / (VIBE.n - 1);
      return { x: fromStage(c + (head - c) * f), y, r: (0.026 + (0.017 + 0.012 * m) * f) * beat, w: (0.25 + (0.55 + 0.35 * m) * f) * (0.4 + 0.6 * e) * beat };
    });
  });
}

// ---------- panel helpers ----------

const head = (title, right = ymd(S.totals.lastDate)) => `<div class="ph"><p class="lbl">${title}</p><p class="lbl">${right}</p></div>`;
// Slides number themselves in order as they're built, so skipped and added slides never leave gaps.
let hudNo = 0;
const hud = (title) => `<div class="hud"><span>${pad(hudNo)} · ${title}</span><span>${serial}</span></div>`;
const cell = (label, value, sub = "") => `<div class="cell"><div><p class="micro" style="opacity:0.7">${label}</p><p class="val roll">${value}${sub ? `<span class="sub">${sub}</span>` : ""}</p></div></div>`;
// A label that rides on hotspot `i`; `at` is its starting spot so nothing jumps before the first frame.
const hot = (i, at, name, count, size = 4.6) => `<span class="hot" data-b="${i}" style="left:${toStage(at.x) * 100}%;top:${toStage(at.y) * 100}%;opacity:0">${count == null ? "" : `<i class="roll">${count}</i>`}<b style="font-size:${size}cqw">${esc(name)}</b></span>`;
const typed = (text, size) => `<p class="quote blend type" style="font-size:${size}cqw">${[...text].map((c) => `<span class="ch">${esc(c)}</span>`).join("")}</p>`;
const bigNum = (text, unit = "", size, cls = "") => `<p class="big roll ${cls}" style="font-size:${size ?? fit(text, [[3, 40], [5, 31], [7, 24], [Infinity, 18]])}cqw">${text}${unit ? `<span class="unit">${unit}</span>` : ""}</p>`;

function clockLayer() {
  const { x: cx, y: cy, R } = DIAL, VW = 1000, VH = 1000 * AR;
  const at = (h, k) => [cx + Math.cos(hourAngle(h)) * R * k, cy + (Math.sin(hourAngle(h)) * R * k) / AR];
  const ticks = [...Array(24)].map((_, h) => {

  }).join("");

  const labels = [0, 3, 6, 9, 12, 15, 18, 21].map((h) => {
    const [x, y] = at(h, 1.3);
    return `<span class="hr${h % 6 === 0 ? " major" : ""}" style="left:${x * 100}%;top:${y * 100}%">${name(h)}</span>`;

function planetLayer() {

function phraseTick(el) {

// Manners: kind words on the left, cross ones on the right, each a hotspot sized by how often it happened. Things

const mannerOf = (pct) => Math.round((pct / 100) * total);

function projectLayer() {

// Syntax: prompt lengths as hotspots sized by area. A one-word prompt is a speck, the typical prompt a small glow,

const SYN_R = 0.46; // the longest prompt's radius, in field widths
const synR = (words) => Math.max(0.028, SYN_R * Math.sqrt(words / Math.max(1, S.style.longestPromptWords)));
const synSpots = [

  { x: 0.12, y: 0.12, words: 1, w: 1.6, c: 0, at: 0.6, name: "1 word", count: `${S.style.oneWordPct}% of prompts` },
  // Its label sits at the hotspot's heart, so the heart stays clear of the card however short the screen.
  { x: 0.7, get y() { const s = slides.find((s) => s.live === synLayout); return Math.min(0.6, 1 - (s?.sheet ?? 38) / 100 - 0.07); }, words: S.style.longestPromptWords, w: 1.05, c: 1, at: 0.9, name: `${fmt(S.style.longestPromptWords)} words`, count: "Longest" },
];
const synLayout = (age) => synSpots.map((p, i) => {

const synLayer = () => { const L = synLayout(99); return `<div class="abs">${synSpots.map((p, i) => (i === 2 ? hot(i, L[i], p.name, p.count, 5.6) : hot(i, L[i], p.name, p.count, 3.6).replace('class="hot"', 'class="hot side"'))).join("")}</div>`; };

const favDay = () => ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][S.time.byWeekday.indexOf(Math.max(...S.time.byWeekday))];
// ---------- Cadence: weekday heat columns with Classification's overlay ----------
const WEEK = [1, 2, 3, 4, 5, 6, 0]; // Monday first
const isWknd = (i) => WEEK[i] === 0 || WEEK[i] === 6;
const weekVals = WEEK.map((d) => S.time.byWeekday[d]), weekMax = Math.max(1, ...weekVals), weekTop = weekVals.indexOf(weekMax);
// The chart's box in stage units, before the top card pushes the picture down by shiftTo. The card sets both, so read
// it every frame.
const cadBox = () => ({ x0: 0.17, x1: 0.89, y0: 0.2, y1: 1 - (slides[cur]?.sheet ?? 0) / 100 - 0.06 - shiftTo });
// 1–4 gridlines whatever the counts: a 1-2-2.5-5 step, scaled by powers of ten.
const colStep = (() => { for (let p = 1; ; p *= 10) for (const k of [1, 2, 2.5, 5]) if (weekMax / (k * p) <= 4) return k * p; })();
const colMax = Math.ceil(weekMax / colStep) * colStep;
const colX = (i, b) => b.x0 + ((b.x1 - b.x0) * i) / 6;
const colGrow = (i, age) => easeOut((age - 0.2 - i * 0.09) / 1.2);

// Each weekday is a column of heat rising from the baseline, hottest at its head. Taller columns get more hotspots, up
// to 9 each but never more than the field holds; when an even week means fewer per column, each one grows to close
// the gap, short of running into the next day.
const colCount = (K) => weekVals.map((v) => (v ? Math.max(2, Math.round(K * (v / weekMax))) : 0));
function columnLayout(age) {
  const b = cadBox();
  let K = 9;
  while (K > 2 && colCount(K).reduce((a, n) => a + n, 0) > NB) K--;
  const counts = colCount(K);
  return weekVals.flatMap((v, i) => {
    // A day you never prompted on stays cold.
    const n = counts[i];
    if (!n) return [];
    const s = v / weekMax, e = colGrow(i, age), beat = 1 + 0.05 * e * Math.sin(age * 2 + i * 1.3);
    const top = b.y1 - (b.y1 - b.y0) * (v / colMax) * e, gap = ((b.y1 - b.y0) * AR * (v / colMax)) / (n - 1);
    const r0 = Math.min(0.056, Math.max(0.046, 0.55 * gap));
    return [...Array(n)].map((_, k) => {
      const f = k / (n - 1); // 0 at the baseline, 1 at the head
      return { x: fromStage(colX(i, b)), y: fromStage(b.y1 + (top - b.y1) * f), r: (r0 + 0.02 * s * f) * beat, w: (0.18 + (0.45 + 0.7 * s) * Math.pow(f, 1.4)) * (0.3 + 0.7 * e) * beat, p: i === weekTop && k === n - 1 ? 1 : 0 };
    });
  });
}

const cmono = (size, u) => `500 ${(size * u).toFixed(1)}px "Geist Mono", ui-monospace, monospace`;
function cline(x, a, b, w, alpha, dash) { x.globalAlpha = alpha; x.lineWidth = w; x.setLineDash(dash ?? []); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); }
// The chart over the heat: dashed gridlines, a baseline, a heavy bar per day (dashed at the weekend), and your
// favourite day as an ink chip with a pink reading and a target mark, the way Classification names your poles.
function drawColumns(x, W, H, u, age) {
  const b = cadBox(), X = (v) => v * W, Y = (v) => v * H, show = easeOut((age - 0.1) / 0.8), tag = easeOut((age - 1.3) / 0.6);
  const L = X(b.x0) - 7 * u, R = X(b.x1) + 5 * u, base = Y(b.y1);
  x.font = cmono(1.45, u); x.textAlign = "right";

    const y = Y(b.y1 - ((b.y1 - b.y0) * v) / colMax);
    cline(x, [L, y], [R, y], 1, 0.35 * show, [0.5 * u, 0.7 * u]);
    x.globalAlpha = 0.6 * show; x.fillText(fmt(v), L - 1.2 * u, y);
  }
  cline(x, [L, base], [R, base], 1, 0.85 * show);
  weekVals.forEach((v, i) => {
    const e = colGrow(i, age), cx = X(colX(i, b)), top = Y(b.y1 - ((b.y1 - b.y0) * v * e) / colMax), wk = isWknd(i);
    cline(x, [cx, base], [cx, top], 0.5 * u, show * (wk ? 0.75 : 1), wk ? [0.7 * u, 0.6 * u] : null);
    x.font = cmono(1.85, u); x.textAlign = "center"; x.globalAlpha = (wk ? 0.5 : 0.85) * show;
    x.fillText(DAYS[WEEK[i]].toUpperCase(), cx, base + 3.2 * u);

      x.font = cmono(1.6, u); x.globalAlpha = 0.85 * tag; x.fillText(val, cx, top - 3 * u);

    x.strokeRect(cx - r, top - r, r * 2, r * 2); x.fillRect(cx - r * 0.45, top - r * 0.45, r * 0.9, r * 0.9);

}
// Draws a slide's chart onto its overlay canvas each frame, crisp at any pixel density.
const canvasTick = (draw) => (el, age) => {
  const c = el.querySelector(".fpc"), w = c.clientWidth, h = c.clientHeight, dpr = sharpness(w, h);
  if (!w) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  x.save(); x.strokeStyle = x.fillStyle = INK; x.textBaseline = "middle";
  try { x.letterSpacing = `${(0.06 * 1.6 * (w / 100)).toFixed(2)}px`; } catch {}
  draw(x, w, h, w / 100, tw.speed ? age : Infinity);
  x.restore();
};
const cadenceTick = canvasTick(drawColumns);

// Streak: every day as a square, a week to a row, the way GitHub draws contributions but turned on its side to fit a
// phone. A hotspot sits on each week, weighted to its busiest days, and the sharp grid on top marks the days you showed
// up: an outline for a day off, a filled square for a day on, bigger the busier it was.
const DAY_MS = 864e5, utc = (k) => Date.parse(k + "T00:00:00Z"), mon = (t) => (new Date(t).getUTCDay() + 6) % 7;
const gridDays = (() => {
  const by = S.time.byDay ?? {}, first = utc(S.totals.firstDate), start = first - mon(first) * DAY_MS, out = [];
  for (let t = start, end = utc(S.totals.lastDate); t <= end; t += DAY_MS) {
    const k = new Date(t).toISOString().slice(0, 10);
    out.push({ k, n: by[k] ?? 0, wk: Math.floor((t - start) / (7 * DAY_MS)), wd: mon(t), pre: t < first });
  }
  return out;
})();
const gridWeeks = (gridDays.at(-1)?.wk ?? 0) + 1;
// Four levels like GitHub's, cut at the quartiles of the days you did prompt.
const litCounts = gridDays.filter((d) => d.n).map((d) => d.n).sort((a, b) => a - b);
const levelCuts = [0.25, 0.5, 0.75].map((f) => litCounts[Math.floor(f * (litCounts.length - 1))] ?? 1);
const dayLevel = (n) => (n ? 1 + levelCuts.filter((c) => n > c).length : 0);
const streak = S.time.longestStreak, inStreak = (k) => streak?.length > 1 && k >= streak.from && k <= streak.to;
// Weeks share a hotspot when there are more of them than the field holds.
const weekGroups = (() => {

    const days = gridDays.filter((d) => d.wk >= w && d.wk < w + per && d.n), sum = days.reduce((a, d) => a + d.n, 0);
    if (sum) out.push({ sum, wd: days.reduce((a, d) => a + d.n * d.wd, 0) / sum, wk: days.reduce((a, d) => a + d.n * d.wk, 0) / sum, hot: days.some((d) => d.k === S.time.busiestDay?.date) });
  }
  return out;
})();
const weekPeak = Math.max(1, ...weekGroups.map((g) => g.sum));
// The grid's box in stage units: room on the right for the streak bracket and its chips, clear of the card.
const gridBox = () => ({ x0: 0.13, x1: 0.7, y0: bare ? 0.1 : 0.2, y1: 1 - (slides[cur]?.sheet ?? 0) / 100 - 0.05 });
function gridGeom() {
  const b = gridBox(), c = Math.min((b.x1 - b.x0) / 7, ((b.y1 - b.y0) * AR) / gridWeeks);
  const gx = (b.x0 + b.x1) / 2 - 3.5 * c, gy = (b.y0 + b.y1) / 2 - (gridWeeks * c) / AR / 2;
  return { c, gx, gy, cx: (wd) => gx + (wd + 0.5) * c, cy: (wk) => gy + ((wk + 0.5) * c) / AR };
}
const gridGrow = (wk, age) => easeOut((age - 0.2 - (wk / gridWeeks) * 0.9) / 0.6);
function streakLayout(age) {
  const g = gridGeom();

// An ink label with a pink reading, kept on the page, the way Cadence names your favourite day.
