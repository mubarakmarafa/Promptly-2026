  stage.style.setProperty("--sheet", s.sheet + "%");
  expandBtn.hidden = !canBare(s);
  expandBtn.setAttribute("aria-pressed", bare);
  expandBtn.setAttribute("aria-label", bare ? "Show the words again" : "Show just the picture");
  restartBtn.hidden = cur === 0;
}

// ---------- zoom ----------

// Pinch the picture to read its small print or frame a screenshot, and drag it around once it's in close. Only the
// picture zooms: the field, the chart and its labels, and the chart's key. The words around it (the slide's label,
// caption and card) hold still with the progress bar and dock. While zoomed, a tap eases back out instead of turning
// the page, and every slide starts unzoomed. On a computer, pinch the trackpad or hold ctrl and scroll; scrolling pans.
const view = document.getElementById("view"), ZMAX = 4, UI = "#dock, #progress, #tilt-ask";
// s is the scale and x, y the offset in stage pixels; sharp is the zoom the canvases are drawn for.
const ZOOM = { s: 1, x: 0, y: 0, sharp: 1 };
// The slide's words live in the same layer as its picture, so they're scaled back down to where they started, and
// the chart's key, which sits among them, is scaled back up with the picture. Individual translate and scale, since
// the words' rise-in animation holds their transform.
let held = [];
function applyZoom() {
  const { s, x, y } = ZOOM, on = s > 1;
  view.style.transform = on ? `translate(${x}px, ${y}px) scale(${s})` : "";
  stage.classList.toggle("zoomed", on);
  for (const n of held) n.style.translate = n.style.scale = "";
  held = [];
  const top = on && els[cur]?.querySelector(".top");
  if (!top) return;
  Object.assign(top.style, { translate: `${-x / s}px ${-y / s}px`, scale: `${1 / s}` });
  held.push(top);
  for (const k of top.querySelectorAll(".fp-key")) {
    Object.assign(k.style, { translate: `${(s - 1) * k.offsetLeft + x}px ${(s - 1) * k.offsetTop + y}px`, scale: `${s}` });
    held.push(k);
  }
}
// Held to between 1x and 4x, and panned no further than the picture's own edges. Eased in script rather than by a
// transition, so the words' counter-scale keeps step with the picture's.
let easing = 0;
function zoomTo(s, x, y, ease) {
  const W = stage.clientWidth, H = stage.clientHeight;
  s = Math.min(ZMAX, Math.max(1, s));
  if (s < 1.02) s = 1;
  const to = { s, x: Math.min(0, Math.max(W - W * s, x)), y: Math.min(0, Math.max(H - H * s, y)) };
  cancelAnimationFrame(easing);
  const done = () => { applyZoom(); if (ease || s === 1) ZOOM.sharp = s; };
  if (!ease) return Object.assign(ZOOM, to), done();
  const from = { ...ZOOM }, t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / 360), e = 1 - (1 - k) ** 4;
    for (const key of ["s", "x", "y"]) ZOOM[key] = from[key] + (to[key] - from[key]) * e;
    if (k < 1) { applyZoom(); easing = requestAnimationFrame(step); } else done();
  };
  easing = requestAnimationFrame(step);
}
// Zoom to s keeping the point at (px, py), in stage pixels, where it is.
const zoomAt = (s, px, py) => {
  s = Math.min(ZMAX, Math.max(1, s));
  zoomTo(s, px - ((px - ZOOM.x) / ZOOM.s) * s, py - ((py - ZOOM.y) / ZOOM.s) * s);
};
// Once a gesture lets go, the canvases redraw sharp for the zoom it landed on.
const settle = () => zoomTo(ZOOM.s, ZOOM.x, ZOOM.y, true);
const local = (p) => { const r = stage.getBoundingClientRect(); return [p.x - r.left, p.y - r.top]; };

const touches = new Map();
let pinch = null, pan = null, swallowUntil = 0;
function startPinch() {
  const [a, b] = touches.values(), [mx, my] = local({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  // The point of the picture between the fingers, which stays between them.
  pinch = { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), s: ZOOM.s, cx: (mx - ZOOM.x) / ZOOM.s, cy: (my - ZOOM.y) / ZOOM.s };
  pan = null;
}
stage.addEventListener("pointerdown", (e) => {
  if (e.button > 0 || e.target.closest(UI)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) startPinch();
  else if (touches.size === 1) pan = { x: e.clientX, y: e.clientY, zx: ZOOM.x, zy: ZOOM.y, moved: false };
});
addEventListener("pointermove", (e) => {
  const p = touches.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (pinch) {
    const [a, b] = touches.values(), [mx, my] = local({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const s = Math.min(ZMAX, Math.max(1, (pinch.s * Math.hypot(a.x - b.x, a.y - b.y)) / pinch.d));
    zoomTo(s, mx - pinch.cx * s, my - pinch.cy * s);
  } else if (pan && ZOOM.s > 1) {
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    // A little slack, so a tap that wobbles is still a tap.
    if (!pan.moved && Math.hypot(dx, dy) < 6) return;
    pan.moved = true;
    stage.classList.add("panning");
    zoomTo(ZOOM.s, pan.zx + dx, pan.zy + dy);
  }
});
function lift(e) {
  if (!touches.delete(e.pointerId)) return;
  // The tap that ends a pinch or a drag isn't a tap on the page.
  if (pinch || pan?.moved) swallowUntil = performance.now() + 400;
  if (pinch && touches.size < 2) {
    pinch = null;
    settle();
    // The finger still down carries on as a drag.
    const [p] = touches.values();
    pan = p ? { x: p.x, y: p.y, zx: ZOOM.x, zy: ZOOM.y, moved: true } : null;
  } else if (!touches.size) {
    if (pan?.moved) settle();
    pan = null;
    stage.classList.remove("panning");
  }
}
addEventListener("pointerup", lift);
addEventListener("pointercancel", lift);
// Runs before the page-turning tap zones see the click.
stage.addEventListener("click", (e) => {
  if (!e.target.closest("#nav")) return;
  if (performance.now() < swallowUntil) return e.stopPropagation();
  if (ZOOM.s > 1 && !hitAt(e, ".redact", 0.02) && !hitAt(e, ".credit a", 0.01)) { e.stopPropagation(); zoomTo(1, 0, 0, true); }
}, true);

let wheelTimer;
stage.addEventListener("wheel", (e) => {
  if (e.target.closest(UI)) return;
  // A trackpad pinch arrives as a ctrl-scroll.
  if (e.ctrlKey || e.metaKey) {
    const [px, py] = local({ x: e.clientX, y: e.clientY });
    zoomAt(ZOOM.s * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.01)), px, py);
  } else if (ZOOM.s > 1) zoomTo(ZOOM.s, ZOOM.x - e.deltaX, ZOOM.y - e.deltaY);
  else return;
  e.preventDefault();
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(settle, 200);
}, { passive: false });
// Safari on a Mac pinches with gesture events instead. On a phone they come alongside the touches, which already
// zoom, so there they only need stopping before they zoom the whole page.
let gesture = null;
stage.addEventListener("gesturestart", (e) => { e.preventDefault(); gesture = touches.size ? null : { s: ZOOM.s }; });
stage.addEventListener("gesturechange", (e) => {
  e.preventDefault();
  if (!gesture || touches.size) return;
  const r = stage.getBoundingClientRect();
  zoomAt(gesture.s * e.scale, (e.clientX ?? r.left + r.width / 2) - r.left, (e.clientY ?? r.top + r.height / 2) - r.top);
});
stage.addEventListener("gestureend", (e) => { e.preventDefault(); if (gesture) { gesture = null; settle(); } });

// ---------- share, save, embed ----------

// Captures the stage as it looks right now, without the buttons. The capture library only loads when someone shares.
const dock = document.getElementById("dock"), acts = document.getElementById("acts"), say = document.getElementById("acts-say");
const expandBtn = dock.querySelector('[data-act="expand"]'), restartBtn = dock.querySelector('[data-act="restart"]');
expandBtn.onclick = (e) => { e.stopPropagation(); setBare(!bare); };
restartBtn.onclick = (e) => { e.stopPropagation(); go(0); };
const themeBtn = dock.querySelector('[data-act="theme"]');
themeBtn.setAttribute("aria-label", DARK ? "Switch to light mode" : "Switch to dark mode");
themeBtn.onclick = (e) => {
  e.stopPropagation();
  const next = DARK ? "light" : "dark";
  const fallback = baseMode === "auto" ? (darkQuery.matches ? "dark" : "light") : baseMode;
  try { next === fallback ? store.removeItem(MODE_KEY) : store.setItem(MODE_KEY, next); } catch {}
  location.hash = cur;
  location.reload();
};
progress.addEventListener("click", (e) => { const i = bars.indexOf(e.target); if (i >= 0) { e.stopPropagation(); go(i); } });
let shotLib = null, shot = null, sayTimer;
async function snapshot() {
  shotLib ??= import("https://cdn.jsdelivr.net/npm/modern-screenshot@4/+esm");
  const { domToBlob } = await shotLib, scale = 1080 / stage.clientWidth;
  const skip = new Set([dock, document.getElementById("nav"), progress, tiltAsk]), restore = hideNames();
  stage.classList.add("shooting");
  try { return await domToBlob(stage, { scale, type: "image/png", filter: (n) => !skip.has(n), style: { borderRadius: "0", boxShadow: "none" } }); }
  finally { restore(); stage.classList.remove("shooting"); }
}
const shotName = () => `promptly-${String(cur + 1).padStart(2, "0")}.png`;
const canShareFiles = !!navigator.canShare?.({ files: [new File([""], "x.png", { type: "image/png" })] });
const canCopyImage = !!(navigator.clipboard?.write && window.ClipboardItem);
function tell(text, ms = 1600) {
  say.textContent = text; say.classList.add("on");
  clearTimeout(sayTimer);
  if (ms) sayTimer = setTimeout(() => say.classList.remove("on"), ms);
}
function saveBlob(blob) {
  const a = document.createElement("a");
  a.download = shotName(); a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
}
// The page as it was written, before any slide was built: an iframe can carry the whole thing with no server. Plain
// ASCII, so it reads right on a host page whatever its charset.
// The embed travels to other people's pages, so its repo names are swapped for their symbols before it leaves.
const embedSource = () => {
  const data = { ...D, projectsHidden: true, stats: { ...S, projects: S.projects.map((p) => ({ ...p, name: disguise(p.name) })) } };
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  return SOURCE.replace(/(<script id="promptly-data" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b);
};
const embedCode = () => `<iframe title="Promptly 2026" style="width:100%;max-width:420px;aspect-ratio:9/16;border:0" srcdoc="${embedSource().replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/[^\x00-\x7f]/gu, (c) => `&#${c.codePointAt(0)};`)}"></iframe>`;
// Already inside someone's page, there's nothing to embed.
acts.querySelector('[data-act="embed"]').hidden = window.self !== window.top;

// Start capturing on press so the share sheet opens while the tap still counts as a tap.
acts.addEventListener("pointerdown", (e) => { if (e.target.closest('[data-act="share"], [data-act="save"]')) shot = snapshot(); });
acts.onclick = async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  e.stopPropagation();
  const act = b.dataset.act;
  if (act === "embed") { await copyText(embedCode()); return tell("Embed code copied"); }
  tell("Capturing…", 0);
  try {
    const blob = await (shot ?? snapshot());
    if (act === "save") { saveBlob(blob); tell("Saved"); }
    else if (canShareFiles) {
      try { await navigator.share({ files: [new File([blob], shotName(), { type: "image/png" })], title: "Promptly 2026" }); say.classList.remove("on"); }
      catch (err) { if (err?.name === "AbortError") say.classList.remove("on"); else { saveBlob(blob); tell("Saved instead"); } }
    } else if (canCopyImage) { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); tell("Image copied"); }
    else { saveBlob(blob); tell("Saved"); }
  } catch (err) {
    console.warn("capture failed", err); tell("Couldn't capture");
  }
  shot = null;
};

// ---------- tweak panel ----------

const $ = (id) => document.getElementById(id), css = getComputedStyle(document.documentElement);
$("tw-pal").innerHTML += Object.keys(PALETTES).map((k) => `<option value="${k}">${k}</option>`).join("");
$("tw-grain").value = parseFloat(css.getPropertyValue("--grain"));
$("tw-blur").value = parseFloat(css.getPropertyValue("--blur"));
$("tw-speed").value = tw.speed;
// Hidden unless the page is opened with ?tweak.
$("tweak-toggle").style.display = new URLSearchParams(location.search).has("tweak") ? "" : "none";
$("tweak-toggle").onclick = () => { $("tweak").hidden = !$("tweak").hidden; };
$("tw-pal").onchange = (e) => { tw.pal = e.target.value; setField(slides[cur]); };
$("tw-mode").onchange = (e) => { tw.mode = e.target.value; setField(slides[cur]); };
$("tw-grain").oninput = (e) => document.documentElement.style.setProperty("--grain", e.target.value);
$("tw-blur").oninput = (e) => document.documentElement.style.setProperty("--blur", e.target.value + "px");
$("tw-speed").oninput = (e) => { tw.speed = +e.target.value; };

build();
go(parseInt(location.hash.slice(1)) || 0);
requestAnimationFrame(frame);
</script>
