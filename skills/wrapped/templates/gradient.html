<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How I AI · Wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161616;
    --paper: #F3F2EE;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --grain: 0.34;
    --blur: 7px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #E4E2DD; color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; overflow: hidden;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    height: min(100dvh - 32px, 920px);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    container-type: size;
    border-radius: 3cqw;
    background: var(--paper);
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.06), 0 30px 70px -24px rgb(0 0 0 / 0.3);
  }
  @media (max-width: 560px) {
    .stage { height: 100dvh; width: 100vw; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  }

  /* Morphing colour field, rendered small and blurred up */
  #field { position: absolute; inset: -5%; width: 110%; height: 110%; filter: blur(var(--blur)); }
  .sheet { position: absolute; inset: auto 0 0; height: var(--sheet, 40%); background: var(--paper); transition: height 820ms var(--ease-out); }
  /* Cover → volume: the page bleeds away like ink on wet paper */
  .burn-cover { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
  .burn-cover canvas { position: absolute; inset: -5%; width: 110%; height: 110%; filter: blur(var(--blur)); }
  #burn { position: absolute; inset: 0; z-index: 8; width: 100%; height: 100%; pointer-events: none; filter: blur(0.7px); display: none; }
  .grain { position: absolute; inset: -40%; z-index: 9; pointer-events: none; opacity: var(--grain); mix-blend-mode: overlay; background-size: 220px; animation: grain 1s steps(5) infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-4%, 3%); } 40% { transform: translate(3%, -2%); } 60% { transform: translate(-2%, -4%); } 80% { transform: translate(4%, 2%); } }

  .progress { position: absolute; z-index: 10; inset: 3cqw 5.5cqw auto; display: flex; gap: 1cqw; }
  .progress span { flex: 1; height: 0.5cqw; border-radius: 1cqw; background: color-mix(in srgb, var(--fg) 25%, transparent); transition: background 300ms; }
  .progress span.done, .progress span.active { background: var(--fg); }

  /* No z-index here: slides must not form their own stacking context, or blend modes can't see the field. */
  .slide { position: absolute; inset: 0; visibility: hidden; }
  .slide.active { visibility: visible; }
  .top { position: absolute; inset: 0 0 auto; height: calc(100% - var(--sheet)); padding: 7.5cqw 5.5cqw 4.6cqw; display: flex; flex-direction: column; gap: 2.2cqw; color: var(--fg); }
  .panel { position: absolute; inset: auto 0 0; height: var(--sheet); padding: 4.8cqw 5.5cqw 5.5cqw; display: flex; flex-direction: column; gap: 2.8cqw; color: var(--ink); }
  .abs { position: absolute; inset: 0; pointer-events: none; color: var(--ink); }
  .grow { flex: 1; min-height: 0; }

  .hud { display: flex; justify-content: space-between; gap: 3cqw; font: 500 2.2cqw/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .hud span:last-child { opacity: 0.6; }
  .lbl { font: 500 2.5cqw/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  .micro { font: 400 1.75cqw/1.35 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.55; }
  .body { font: 400 3.5cqw/1.42 var(--sans); text-wrap: pretty; }
  .display { font: 300 11cqw/0.92 var(--sans); letter-spacing: -0.045em; text-wrap: balance; }
  .roll { font-variant-numeric: tabular-nums; }
  /* White + difference: near-black on paper, the heat's opposite colour wherever a hotspot passes behind */
  .blend { color: #fff; mix-blend-mode: difference; }
  .big { font: 300 30cqw/0.82 var(--sans); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mid { font: 300 15cqw/0.85 var(--sans); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .unit { font: 300 0.22em var(--sans); letter-spacing: -0.01em; opacity: 0.6; margin-left: 0.25em; }
  .quote { font: 400 8cqw/1.05 var(--sans); letter-spacing: -0.03em; text-wrap: pretty; }

  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 3cqw; padding-bottom: 2.2cqw; border-bottom: 0.25cqw solid color-mix(in srgb, var(--ink) 12%, transparent); }

  .cells { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw 5cqw; }
  .cell { display: flex; justify-content: space-between; align-items: flex-end; gap: 2cqw; }
  .cell .val { font: 400 5.6cqw/1.05 var(--sans); letter-spacing: -0.02em; margin-top: 0.8cqw; font-variant-numeric: tabular-nums; }
  .cell .sub { font: 400 2.6cqw var(--sans); opacity: 0.55; margin-left: 0.4em; letter-spacing: 0; }



  /* Labels that ride on hotspots; positions are set every frame from the field */
  .hot { position: absolute; translate: -50% -50%; display: flex; flex-direction: column; align-items: flex-start; white-space: nowrap; }
  .hot i { padding: 0.35cqw 0.9cqw; background: #111; color: rgb(243 242 238 / 0.7); font: 500 1.5cqw/1.2 var(--mono); font-style: normal; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .hot.side { translate: 4.4cqw -50%; }
  .hot b { padding: 0.8cqw 1.5cqw 1cqw; background: #E9E6DF; color: #111; font: 400 4.6cqw/1 var(--sans); letter-spacing: -0.03em; }
  /* Manners that never happened: an empty dashed ring where the glow would be */
  .orb.ghost { position: absolute; translate: -50% -50%; display: flex; flex-direction: column; white-space: nowrap; color: var(--ink); text-shadow: none; opacity: 0; }
  .orb.ghost .ring { border: 1px dashed rgb(22 22 22 / 0.45); }
  .orb.ghost b { font-family: var(--sans); font-weight: 400; line-height: 1; letter-spacing: -0.03em; }
  .orb.ghost i { color: rgb(22 22 22 / 0.6); font: 500 1.6cqw/1.2 var(--mono); font-style: normal; letter-spacing: 0.06em; }
  .slide.active .orb.ghost { animation: fade-in 800ms var(--ease-out) forwards; animation-delay: calc(var(--k) * 150ms + 1200ms); }
  .side-h { position: absolute; top: 19cqw; opacity: 0.7; }
  .orb { align-items: center; color: #fff; text-shadow: 0 0 2cqw rgb(60 20 80 / 0.25); }
  .orb .ring { position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); translate: -50% -50%; border: 1px solid rgb(255 255 255 / 0.85); border-radius: 50%; }
  .orb b { padding: 0; background: none; color: inherit; }
  .orb i { padding: 0; margin-top: 0.8cqw; background: none; color: rgb(255 255 255 / 0.85); font-size: 1.6cqw; }

  /* Cover: ASCII on three depth planes behind the title; the far ones are softer */
  .ascii { position: absolute; inset: 0 0 var(--sheet); pointer-events: none; -webkit-mask-image: linear-gradient(#000 50%, transparent 92%); mask-image: linear-gradient(#000 50%, transparent 92%); }
  .ascii canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ascii .back { filter: blur(1.6px); }

  /* Volume: months strung on a white line */
  .chartline { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .mline { fill: none; stroke: #fff; stroke-width: 2.4; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .slide.active .mline { animation: draw-line 900ms var(--ease-out) forwards 100ms; }
  @keyframes draw-line { to { stroke-dashoffset: 0; } }
  .mnode { fill: #fff; transform-box: fill-box; transform-origin: center; }
  .slide.active .mnode { animation: pop 500ms var(--ease-out) both; animation-delay: calc(var(--d) * 160ms + 100ms); }
  .mlabel { position: absolute; translate: -50% 0; margin-top: 2.6cqw; display: grid; justify-items: center; gap: 0.4cqw; color: var(--ink); opacity: 0; }
  .mlabel b { font: 400 3.8cqw/1 var(--sans); letter-spacing: -0.02em; }
  .mlabel i { font: 500 2cqw var(--mono); font-style: normal; letter-spacing: 0.05em; opacity: 0.7; }
  .slide.active .mlabel { animation: fade-in 600ms var(--ease-out) forwards; animation-delay: calc(var(--d) * 160ms + 200ms); }
  @keyframes fade-in { to { opacity: 1; } }

  /* Agents: nested circles on a crosshair */
  .orbit { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .orbit circle, .orbit line, .orbit path { fill: none; stroke: #fff; stroke-width: 2.2; }
  .orbit .faint { stroke-opacity: 0.55; stroke-width: 1.4; }
  .orbit .dash { stroke-dasharray: 6 8; stroke-opacity: 0.95; stroke-width: 1.6; }
  .orbit .ring { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .slide.active .orbit .ring { animation: draw-line 1600ms var(--ease-out) forwards; animation-delay: calc(var(--d, 0) * 300ms + 200ms); }
  /* Agent names set along their circles */
  .orbit text { stroke: none; fill: var(--ink); }
  .orbit .agl { font: 500 24px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .orbit .agl .n { opacity: 0.5; }
  .slide.active .orbit text { animation: fade-in 700ms var(--ease-out) both 500ms; }

  /* Machine-vision tracking: a pink target on a moving point */
  .mark { position: absolute; width: 1.8cqw; height: 1.8cqw; translate: -50% -50%; border: 1px solid #FF4FA0; }
  .mark::after { content: ""; position: absolute; inset: 0.45cqw; background: #FF4FA0; }
  .links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .links line { stroke: #fff; stroke-opacity: 0.9; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .slide.active .mark, .slide.active .links line { animation: fade-in 600ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 120ms + 300ms); }
  /* Readout chips: a value cell with a readout strip on top; a tick ties each to its node */
  .chip { position: absolute; display: flex; translate: 3.4cqw -50%; white-space: nowrap; }
  .chip.flip { translate: calc(-100% - 3.4cqw) -50%; }
  .chip::before { content: ""; position: absolute; right: 100%; top: 50%; width: 3.4cqw; height: 1px; background: #fff; }
  .chip.flip::before { right: auto; left: 100%; }
  .chip em { position: absolute; left: 0; bottom: 100%; padding: 0.35cqw 0.9cqw; background: #111; color: rgb(243 242 238 / 0.7); font: 500 1.5cqw/1.2 var(--mono); font-style: normal; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .chip b { display: flex; align-items: center; padding: 0.8cqw 1.3cqw; background: #E9E6DF; color: #111; font: 500 2.4cqw/1 var(--mono); letter-spacing: 0.02em; }
  .chip strong { padding: 0.7cqw 1.6cqw 0.9cqw; background: rgb(17 17 17 / 0.92); color: #F3F2EE; font: 400 var(--fs)/1 var(--sans); letter-spacing: -0.025em; }
  .chip.lead em { color: #FF7DB8; }
  .chip.lead b { background: #FF4FA0; color: #fff; }
  /* Catchphrases: the phrase itself fills the cell, the count rides in the strip */
  .chip.word b { padding: 0.9cqw 1.6cqw 1.1cqw; font: 400 var(--fs)/1 var(--sans); letter-spacing: -0.03em; }
  /* Dot-plot grid: row guides, tick columns, axis, ranked labels */
  .rowg { position: absolute; left: 0; right: 0; border-top: 1px dashed rgb(22 22 22 / 0.2); }
  .colg { position: absolute; border-left: 1px dashed rgb(22 22 22 / 0.14); }
  .axis { position: absolute; translate: -50% -140%; font: 500 1.7cqw var(--mono); letter-spacing: 0.05em; opacity: 0.6; }
  .slide.active .chip { animation: fade-in 600ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 120ms + 300ms); }
  .mostyou { font: 400 7.4cqw/1 var(--sans); letter-spacing: -0.035em; color: color-mix(in srgb, var(--c3) 45%, #1F0B45); text-wrap: balance; }

  /* Fingerprint axes and pole names */
  .fp { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .fp line { stroke: var(--ink); stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 5; vector-effect: non-scaling-stroke; }
  .fp circle { fill: var(--ink); }
  .pole { position: absolute; translate: -50% -50%; font: 500 1.9cqw var(--mono); text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.45; white-space: nowrap; color: var(--fg); }
  .pole.l { translate: 0 -180%; }
  .pole.r { translate: -100% -180%; }
  .pole.on { opacity: 1; }


  /* Mood over time */

  /* Typed quotes, with a mini dial for when they were sent */
  .type .ch { opacity: 0; }
  .type .ch.on { opacity: 1; }
  .type .ch.cur::after { content: ""; display: inline-block; width: 0.06em; height: 0.85em; margin-left: 0.04em; vertical-align: -0.08em; background: currentColor; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* Greatest hits: a frosted card over a full-bleed field, in two panes with opposite corners cut */
  .qcard { display: flex; flex-direction: column; gap: 0.5cqw; margin: 0 2cqw; color: var(--ink); }
  .qcard > div { padding: 6cqw 6.4cqw; background: linear-gradient(160deg, rgb(255 255 255 / 0.72), rgb(255 255 255 / 0.5)); -webkit-backdrop-filter: blur(5cqw) saturate(1.15); backdrop-filter: blur(5cqw) saturate(1.15); }
  .qcard .qa { min-height: 62cqw; display: flex; flex-direction: column; gap: 4.4cqw; clip-path: polygon(6cqw 0, 100% 0, 100% 100%, 0 100%, 0 6cqw); }
  .qcard .qb { display: flex; flex-direction: column; gap: 3cqw; padding-bottom: 8cqw; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6cqw), calc(100% - 6cqw) 100%, 0 100%); }
  .qcard .qq { font: 500 var(--fs)/1.12 var(--sans); letter-spacing: -0.025em; text-wrap: pretty; }

  /* Lab report: plain paper, with the colour kept to one petri dish of cultured replies */
  .lab-head { display: grid; grid-template-columns: 1fr 42cqw; gap: 5cqw; align-items: center; margin-top: 1cqw; }
  /* The dish is wider than its column and runs off the right edge of the page. */
  .dish-w { width: 58cqw; }
  .dish { position: relative; width: 58cqw; aspect-ratio: 1; border-radius: 50%; border: 1px solid rgb(22 22 22 / 0.5); }
  .dish::before { content: ""; position: absolute; inset: 1.6cqw; border-radius: 50%; border: 1px solid rgb(22 22 22 / 0.18); }
  .dish .n { position: absolute; translate: -50% -50%; font: 500 1.8cqw/1 var(--mono); letter-spacing: 0.04em; }
  .fig { margin-top: 1.8cqw; padding-right: 22cqw; text-align: center; font: 400 1.7cqw/1.35 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; }
  .lab-legend { display: flex; flex-direction: column; font: 400 2.3cqw/1.3 var(--mono); }
  .lab-legend p { display: flex; gap: 1.8cqw; min-width: 0; padding: 1.5cqw 0; border-bottom: 1px solid rgb(22 22 22 / 0.12); }
  .lab-legend p:first-child { border-top: 1px solid rgb(22 22 22 / 0.12); }
  .lab-legend b { font-weight: 500; opacity: 0.45; }
  .lab-legend span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lab-sec { display: flex; flex-direction: column; gap: 2.2cqw; margin-top: 1.6cqw; }
  .lab-sec .body { font-size: var(--fs); line-height: 1.45; }

  /* Clock dial over the heat ring */
  .dial { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dial circle, .dial line { fill: none; stroke: #fff; vector-effect: non-scaling-stroke; }
  .hr { position: absolute; transform: translate(-50%, -50%); font: 500 2.1cqw var(--mono); letter-spacing: 0.05em; opacity: 0.4; }
  .hr.major { opacity: 0.85; }
  .ring-c { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 0.6cqw; text-align: center; }
  .ring-c b { font: 300 10cqw/0.9 var(--sans); letter-spacing: -0.04em; }

  /* Weekday pills: each rises into place over its day, then its number lands. */
  .chart { position: relative; flex: 1; min-height: 0; margin: 2cqw 0 0; --H: calc(100% - 6cqw); }
  .chart .pill { position: absolute; width: 6.4cqw; translate: -50% 0; --cap: var(--c3); --body: var(--c2); }
  .chart .pill.wknd { --cap: color-mix(in srgb, var(--c1) 35%, #F27BA6); --body: var(--c3); }
  .chart .pill::after { content: ""; position: absolute; inset: 2.5cqw -0.4cqw 0; border-radius: 3.2cqw; filter: blur(1.5cqw);
    background: linear-gradient(to bottom, var(--cap), var(--body) 12cqw, var(--body) 55%, color-mix(in srgb, var(--body) 45%, transparent) 85%, transparent); }
  .chart .pill::before { content: ""; position: absolute; z-index: 1; inset: 0 0 auto; height: 12cqw; border-radius: 3.2cqw 3.2cqw 0 0;
    background: linear-gradient(to bottom, var(--cap) 0 38%, var(--body));
    -webkit-mask-image: linear-gradient(#000 45%, transparent); mask-image: linear-gradient(#000 45%, transparent); }
  .chart .num { position: absolute; translate: -50% -100%; font: 500 2.3cqw var(--mono); letter-spacing: 0.04em; }
  .chart .num.peak { font-weight: 500; font-size: 2.8cqw; }
  .slide.active .chart .pill { animation: pill-rise 1200ms var(--ease-out) both; animation-delay: calc(var(--d) * 90ms + 250ms); }
  @keyframes pill-rise { from { translate: -50% var(--rise); opacity: 0; } 30% { opacity: 1; } }
  .chart .num { opacity: 0; }
  .slide.active .chart .num { animation: num-in 600ms var(--ease-out) forwards; animation-delay: calc(var(--d) * 70ms + 1250ms); }
  @keyframes num-in { from { opacity: 0; translate: -50% -60%; } to { opacity: 1; translate: -50% -100%; } }
  .chart .day { position: absolute; bottom: 0; transform: translateX(-50%); font: 500 2cqw var(--mono); text-transform: uppercase; opacity: 0.7; }

  /* Vibe check: pole names over each dial, a note under it */
  .vline { position: absolute; height: 0; border-top: 1px dashed rgb(22 22 22 / 0.2); }
  .vend { position: absolute; width: 1.6cqw; height: 1.6cqw; translate: -50% -50%; border-radius: 50%; background: var(--ink); }
  .vend.mid { width: 1.1cqw; height: 1.1cqw; }
  .vpole { position: absolute; translate: 0 2.8cqw; font: 400 3.1cqw/1 var(--mono); text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); white-space: nowrap; }
  .vpole.l { left: 5.2cqw; } .vpole.r { right: 5.2cqw; }
  .vnote { position: absolute; left: 5.2cqw; width: 74cqw; translate: 0 8.6cqw; font: 400 3.3cqw/1.3 var(--sans); color: var(--ink); opacity: 0.45; text-wrap: pretty; }
  .slide.active .vpole, .slide.active .vnote { animation: rise-in 600ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 120ms + 150ms); }
  @keyframes rise-in { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(0); } }

  .top > *, .panel > * { opacity: 0; transform: translateY(2.4cqw); }
  .slide.active .top > *, .slide.active .panel > * { animation: rise 620ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 80ms + 120ms); }
  .slide.active .panel > * { animation-delay: calc(var(--i, 0) * 80ms + 320ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .slide.active .top > *, .slide.active .panel > * { animation: none; opacity: 1; transform: none; }
    .slide.active .vpole, .slide.active .vnote, .slide.active .chart .pill { animation: none; }
    .slide.active .chart .num { animation: none; opacity: 1; }
    .slide.active .mline, .slide.active .orbit .ring, .slide.active .mnode { animation: none; stroke-dashoffset: 0; }
    .mlabel { opacity: 1; }
    .type .ch { opacity: 1; }
    .grain { animation: none; }
  }

  .share-card { flex: 1 1 0; min-height: 0; width: auto; max-width: 100%; align-self: center; aspect-ratio: 9/16; display: block; border-radius: 2cqw; box-shadow: 0 1cqw 4cqw rgb(0 0 0 / 0.18); }
  .actions { display: flex; gap: 2.4cqw; position: relative; z-index: 6; }
  .btn { flex: 1; appearance: none; border: 0; cursor: pointer; padding: 3.6cqw; border-radius: 2cqw; font: 500 3cqw var(--mono); text-transform: uppercase; letter-spacing: 0.05em; background: var(--ink); color: #fff; transition: transform 140ms var(--ease-out); }
  .btn.alt { background: #fff; color: var(--ink); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 0.6cqw solid var(--c3); outline-offset: 0.6cqw; }

  .nav { position: absolute; inset: 0; z-index: 5; display: flex; }
  .nav button { flex: 1; background: none; border: 0; cursor: pointer; }
  .nav button:first-child { flex: 0 0 30%; }

  /* Exploration controls */
  .tweak-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 20; appearance: none; border: 0; cursor: pointer; padding: 10px 14px; border-radius: 99px; background: #161616; color: #fff; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .tweak { position: fixed; right: 16px; bottom: 60px; z-index: 20; width: 240px; padding: 14px; border-radius: 14px; background: rgb(255 255 255 / 0.92); backdrop-filter: blur(12px); box-shadow: 0 10px 40px -10px rgb(0 0 0 / 0.3); display: grid; gap: 10px; font: 400 12px var(--mono); }
  .tweak[hidden] { display: none; }
  .tweak label { display: grid; gap: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tweak select, .tweak input { width: 100%; font: inherit; }
  @media (max-width: 560px) { .tweak-toggle { display: none; } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="field" width="90" height="160" aria-hidden="true"></canvas>
  <div class="sheet"></div>
  <div class="progress" id="progress"></div>
  <div id="slides"></div>
  <canvas id="burn" aria-hidden="true"></canvas>
  <div class="nav" id="nav"><button aria-label="Previous"></button><button aria-label="Next"></button></div>
  <div class="grain" id="grain"></div>
</main>

<button class="tweak-toggle" id="tweak-toggle">Tweak</button>
<aside class="tweak" id="tweak" hidden>
  <label>Palette <select id="tw-pal"><option value="">Per slide</option></select></label>
  <label>Field <select id="tw-mode"><option value="">Per slide</option><option value="soft">Soft</option><option value="bands">Thermal bands</option></select></label>
  <label>Grain <input type="range" id="tw-grain" min="0" max="0.8" step="0.01"></label>
  <label>Blur <input type="range" id="tw-blur" min="0" max="24" step="1"></label>
  <label>Speed <input type="range" id="tw-speed" min="0" max="4" step="0.1" value="1"></label>
</aside>

<script id="wrapped-data" type="application/json">/*__WRAPPED_DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById("wrapped-data").textContent);
const S = D.stats, P = D.persona;

const SOURCE_LABEL = { "claude-code": "Claude Code", codex: "Codex", cursor: "Cursor" };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmt = (n) => Number(n).toLocaleString("en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hourLabel = (h) => (h % 12 || 12) + (h < 12 ? " am" : " pm");
const ymd = (d) => { const [y, m, day] = d.split("-"); return `${+day}/ ${m}/ ${y}`; };
const cap = (key, fallback) => esc(P.captions?.[key] ?? fallback);
const pad = (n, w = 2) => String(n).padStart(w, "0");
// Fit long text by length: [maxChars, size] pairs.
const fit = (text, steps) => (steps.find(([n]) => String(text ?? "").length <= n) ?? steps.at(-1))[1];

const sources = Object.entries(D.sources).filter(([, v]) => v.prompts > 0).sort((a, b) => b[1].prompts - a[1].prompts);
const total = S.totals.prompts;
const who = D.name ?? "You";
const serial = "HIA-" + (S.totals.lastDate ?? "").replace(/-/g, "").slice(2);
const maxHour = Math.max(...S.time.byHour) || 1;

// ---------- palettes: low → high intensity ----------

const PALETTES = {
  flare: { name: "periwinkle, hot pink, orange & sun", stops: ["#F1ECF4", "#A9B2FF", "#FF5FA2", "#FF7A2A", "#FFE45C"] },
  dusk: { name: "lavender, pink & marigold", stops: ["#ECE8F2", "#BFC6F2", "#F4A6C8", "#FF8F45", "#FFD95A"] },
  bloom: { name: "periwinkle, pink & tangerine", stops: ["#ECE8F2", "#8C9BFF", "#FF79B4", "#FF6A1F", "#FFCF3A"] },
  infra: { name: "lilac, coral, magenta & plum", stops: ["#F1EFEC", "#D8D1F3", "#FF9C84", "#EE4577", "#3B1D5E"] },
  peach: { name: "peach, salmon, orchid & sky", stops: ["#F6EEE6", "#FFD0B0", "#FFA3A3", "#C58CF0", "#8FD3F5"] },
  sky: { name: "blue, butter & tangerine", stops: ["#8FBDF4", "#C4E1F6", "#FFF2B2", "#FFB65E", "#FF6A3D"] },
  dawn: { name: "blush, tangerine & iris", stops: ["#EEECE8", "#F6DAE3", "#FFAE8A", "#958BF4", "#EEECE8"] },
  ember: { name: "scarlet, orange & violet", stops: ["#FFD9B8", "#FFA45E", "#FF5E3D", "#DD2F57", "#6438CC"] },
  mint: { name: "mint, sea & lilac", stops: ["#E9F4EF", "#A8E8D3", "#7CC6F0", "#B79CF2", "#F6C5E4"] },
  // Heat ramps for hotspots that sit side by side (one per project). Each travels through its own run of hues from rim
  // to core, the way the cover does, and no two share a core.
  lagoon: { name: "lilac, sky, teal & lime", stops: ["#F3F2EE", "#CDBDFF", "#6EC3F5", "#3FD3B0", "#C8EF5A"] },
  orchid: { name: "sky, lavender, magenta & pink", stops: ["#F3F2EE", "#9CD0FF", "#A98BFF", "#E04FD0", "#FF7AA8"] },
  citrus: { name: "mint, lime, yellow & orange", stops: ["#F3F2EE", "#A6EBCD", "#C8EB55", "#FFD93D", "#FF8A2A"] },
  rose: { name: "peach, coral, magenta & plum", stops: ["#F3F2EE", "#FFC6AE", "#FF7C70", "#E83C8C", "#7A2C9E"] },
  cobalt: { name: "mint, aqua, cobalt & violet", stops: ["#F3F2EE", "#B0EEDF", "#5CC8E8", "#4A6DF0", "#7A3DDB"] },
  lime: { name: "butter, lime, green & teal", stops: ["#F3F2EE", "#FFF0A0", "#A8E05A", "#3CC28A", "#1E9BA8"] },
  // Two single-hue ramps for slides that colour each hotspot by who it belongs to.
  glacier: { name: "paper to sky", stops: ["#F3F2EE", "#CDE8FF", "#8FCBFF", "#55AEFF", "#2F8CFF"] },
  lilac: { name: "paper to violet", stops: ["#F3F2EE", "#DCCFFF", "#B89CFF", "#9871FF", "#7C4DFF"] },
};

// ---------- field layouts (x, y in 0..1 of the stage) ----------

function rng(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
const scatter = (seed, n = 5, [x0, y0, x1, y1] = [0, 0, 1, 0.7]) => { const r = rng(seed); return [...Array(n)].map(() => ({ x: x0 + r() * (x1 - x0), y: y0 + r() * (y1 - y0), r: 0.2 + r() * 0.24, w: 0.7 + r() * 0.7 })); };
// Stage height / width. Everything round is laid out from this, so circles stay circles on any screen shape.
let AR = 16 / 9;
const measure = () => { const st = document.getElementById("stage"); AR = st.clientHeight / st.clientWidth || 16 / 9; };
// The field canvas overhangs the stage by 5% each side: field coord f maps to stage coord -0.05 + 1.1f.
const fromStage = (v) => (v + 0.05) / 1.1;
// Clock geometry in stage coords (x, R in widths; y in heights), fitted between the header and the panel.
let DIAL = { x: 0.5, y: 0.34, R: 0.32 };
function layoutDial(sheet = 0.38) {
  const top = 0.16 / AR, bottom = 1 - sheet - 0.07 / AR, room = ((bottom - top) * AR) / 2;
  DIAL = { x: 0.5, y: (top + bottom) / 2, R: Math.max(0.12, Math.min(0.33, (room - 0.025) / 1.3)) };
}
// 12am points straight up.
const hourAngle = (h) => (h / 24) * Math.PI * 2 - Math.PI / 2;
// Neighbouring hours overlap and add up, so a run of busy hours would outshine a lone peak. Solve for the weights that make
// the field at each hour match that hour's own count, with the peak hour set a step hotter than everything else.
const ring = () => {
  const R = DIAL.R / 1.1, r = 0.052, n = 24, peak = S.time.peakHour;
  const target = S.time.byHour.map((v, h) => (h === peak ? 1.3 : 0.06 + 0.9 * Math.pow(v / maxHour, 1.3)));
  const K = [...Array(n)].map((_, i) => [...Array(n)].map((_, j) => { const d = 2 * R * Math.sin((Math.PI * Math.abs(i - j)) / n); return Math.exp(-(d * d) / (r * r)); }));
  const w = target.slice();
  for (let it = 0; it < 30; it++) for (let h = 0; h < n; h++) w[h] = Math.max(0, w[h] + target[h] - K[h].reduce((f, k, j) => f + k * w[j], 0));
  return w.map((wh, h) => {
    const a = hourAngle(h);
    return { x: 0.5 + Math.cos(a) * R, y: fromStage(DIAL.y) + (Math.sin(a) * R) / AR, r, w: wh, p: h === peak ? 1 : 0 };
  });
};


// Cover: your hotspot grows while smaller ones drift in from the edges, curl around and merge into it.
const SWARM = { x: 0.5, y: 0.3, n: 7 };
function swarmLayout(age) {
  const grow = 1 - Math.exp(-age / 2.5), breathe = Math.sin(age * 1.8);
  const out = [{ x: SWARM.x + 0.02 * Math.sin(age * 0.7), y: SWARM.y + 0.015 * Math.cos(age * 0.6), r: 0.15 + 0.13 * grow + 0.012 * breathe, w: 1 + 0.75 * grow }];
  for (let i = 1; i <= SWARM.n; i++) {
    const period = 3.6 + i * 0.55, cyc = (age + i * 1.7) / period, ph = cyc % 1, lap = Math.floor(cyc);
    const ang = i * 2.39 + lap * 2.1 + ph * 1.4, dist = 0.64 * (1 - ph * ph * (3 - 2 * ph)) + 0.02;
    out.push({ x: SWARM.x + Math.cos(ang) * dist, y: SWARM.y + (Math.sin(ang) * dist * 1.3) / AR, r: 0.09 + 0.05 * Math.sin(ph * Math.PI), w: 0.9 * Math.sin(Math.min(1, ph * 1.1) * Math.PI) });
  }
  return out;
}

const toStage = (v) => -0.05 + v * 1.1;
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const easeOut = (k) => 1 - Math.pow(1 - clamp01(k), 3);
// Cover ASCII: the heat field redrawn as a dense type grid, light to heavy glyphs, with bands that pulse outward.
// Two planes: a big, soft, faint one zoomed out behind, and a small crisp one in front. Hotter cells are more opaque.
const RAMP = " ·-:/+=<>!?I3254968A0ON";
const ASCII = [
  { cls: "back", size: 0.036, alpha: 0.28, zoom: 1.16, pulse: -1.1 },
  { cls: "front", size: 0.021, alpha: 0.7, zoom: 1, pulse: 1.6 },
];
const asciiLayer = () => `<div class="ascii" aria-hidden="true">${ASCII.map((L) => `<canvas class="${L.cls}"></canvas>`).join("")}</div>`;
function asciiTick(el, age) {
  const W = el.clientWidth, H = el.clientHeight, dpr = Math.min(2, devicePixelRatio || 1), fade = tw.speed ? easeOut(age / 1.8) : 1;
  const cx = toStage(SWARM.x), cy = toStage(SWARM.y), LV = 4;
  el.querySelectorAll(".ascii canvas").forEach((c, li) => {
    const L = ASCII[li], w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const x = c.getContext("2d"), fs = L.size * W;
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    x.font = `400 ${fs.toFixed(2)}px "Geist Mono", ui-monospace, monospace`;
    x.textBaseline = "top"; x.fillStyle = "#fff";
    const adv = x.measureText("N").width, lh = fs * 1.2, cols = Math.ceil(w / adv), rows = Math.ceil(h / lh);
    // Each row is drawn as a few strings, one per opacity level, so the grid stays monospaced and cheap.
    for (let r = 0; r < rows; r++) {
      const lines = [...Array(LV)].map(() => Array(cols).fill(" "));
      const sy = cy + (((r + 0.5) * lh) / H - cy) * L.zoom;
      for (let col = 0; col < cols; col++) {
        const g = heatAt(cx + (((col + 0.5) * adv) / W - cx) * L.zoom, sy);
        // Light → heavy → light rings that travel outward, fading out where the heat runs out.
        const v = (0.5 - 0.5 * Math.cos(g * Math.PI * 3.2 - age * L.pulse)) * clamp01(g / 0.25);
        const i = Math.round(v * (RAMP.length - 1));
        if (i) lines[Math.min(LV - 1, Math.floor(v * LV))][col] = RAMP[i];
      }
      lines.forEach((ln, k) => { x.globalAlpha = L.alpha * fade * (0.3 + (0.7 * (k + 1)) / LV); x.fillText(ln.join(""), 0, r * lh); });
    }
  });
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthName = (key) => MONTHS[+key.slice(5, 7) - 1];
const byKey = (o) => Object.entries(o ?? {}).sort(([a], [b]) => a.localeCompare(b));
const short = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : fmt(n));

// Volume: one hotspot per month, growing in turn and then pulsing in place, the latest swelling to fill the screen.
const GROW_Y = 0.33;
const months = byKey(S.time.byMonth).slice(-6), monthMax = Math.max(1, ...months.map(([, v]) => v));
function growthLayout(age) {
  const n = months.length;
  return months.map(([, v], i) => {
    const s = Math.sqrt(v / monthMax), e = easeOut((age - 0.1 - i * 0.16) / 0.6);
    const swell = i === n - 1 ? easeOut((age - 0.4 - n * 0.16) / 2) : 0;
    const pulse = 1 + 0.06 * e * Math.sin(age * 1.8 + i * 0.9);
    return { x: n === 1 ? 0.5 : 0.16 + (i * 0.68) / (n - 1), y: GROW_Y, r: (0.02 + (0.05 + 0.15 * s) * e + 0.1 * swell * s) * pulse, w: ((0.3 + 0.95 * s) * e + 0.3 * swell) * pulse };
  });
}

const outTokens = sources.reduce((a, [, v]) => a + (v.outputTokens ?? 0), 0), wordsBack = Math.round(outTokens * 0.75);

// Agents: one circle per agent, nested and centred, each its own colour. Areas follow prompt counts, so the
// biggest agent is the outer circle and a small one is a small disc in the middle.
const ORBIT_Y = 0.31, AGENT_R = 0.3; // centre in field heights; the outer circle's radius in stage widths
const agents = sources.slice(0, 4);
const agentR = (v) => Math.max(0.16, Math.sqrt(v.prompts / agents[0][1].prompts)) * AGENT_R;
const planetLayout = (age) => agents.map(([, v], i) => ({
  x: 0.5, y: ORBIT_Y, r: (agentR(v) / 1.1) * (i ? 1.05 : 0.95) * (1 + 0.03 * Math.sin(age * 1.4 + i * 2)), w: i ? 1.4 : 0.85, c: i ? 1 : 0,
}));

// Catchphrases: a dot plot. One row per phrase in rank order; each hotspot travels from zero to its count, then pulses in place.
const phrases = S.phrases.catchphrases.slice(0, 6), phraseMax = phrases[0]?.count || 1;
const PLOT = { x0: 8, x1: 88, top: 0.22, bottom: 0.58 }; // x in stage %, rows in field heights
const plotStep = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find((st) => phraseMax / st <= 6) ?? 1000;
const plotMax = Math.max(plotStep, Math.ceil(phraseMax / plotStep) * plotStep);
const rowY = (i) => PLOT.top + ((PLOT.bottom - PLOT.top) * i) / Math.max(1, phrases.length - 1);
const plotX = (v) => PLOT.x0 + ((PLOT.x1 - PLOT.x0) * v) / plotMax;
const phraseLayout = (age) => phrases.map((p, i) => {
  const s = Math.sqrt(p.count / phraseMax), e = easeOut((age - 0.3 - i * 0.12) / 1.5), beat = 1 + 0.08 * e * Math.sin(age * 2 + i * 1.1);
  return { x: fromStage(plotX(p.count * e) / 100), y: rowY(i), r: (0.022 + 0.04 * s) * beat, w: (0.4 + 0.85 * s) * (0.3 + 0.7 * e) * beat };
});
const opener = S.phrases.topOpeners.find((o) => o.name.length > 1)?.name;
const mostYou = [opener, ...phrases.slice(0, 5).map((p) => p.name)].filter(Boolean).join(" … ") + "…";

// Projects: a map, the main project as the sun and the rest as islands around it. Each is a hotspot with its own heat
// palette; they sit close enough to bleed into each other, and drift a little so the blends keep shifting.
const projects = S.projects.slice(0, 7), projMax = projects[0]?.count || 1;
const PROJECT_PALS = ["flare", "lagoon", "orchid", "citrus", "rose", "cobalt", "lime"];
const projectLayout = (age) => projects.map((p, i) => {
  const s = Math.sqrt(p.count / projMax);
  if (!i) return { x: 0.5 + 0.01 * Math.sin(age * 0.5), y: 0.34, r: 0.08 + 0.12 * s, w: 1.1, c: 0 };
  const a = i * 2.4 + 0.3 + 0.08 * Math.sin(age * 0.3 + i * 1.7), d = 0.14 + 0.022 * i + 0.025 * Math.sin(age * 0.4 + i);
  return { x: 0.5 + Math.cos(a) * d, y: 0.34 + (Math.sin(a) * d * 1.3) / AR, r: 0.07 + 0.1 * s, w: 0.75 + 0.5 * s, c: i };
});

// Archetype: four dashed axes, one per trait. Each trait is a comet, like on the vibe check: it streaks out from the
// centre toward the pole you lean to, hottest at its head, and goes further the stronger the lean.
const FP = { x: 0.5, y: fromStage(0.31), L: 0.4 / 1.1, n: 7 }; // field coords; L is the arm length
const traits = (P.traits ?? []).slice(0, 4);
const axisAngle = (i) => -Math.PI / 2 + (i * Math.PI) / 4;
const lean = (t) => Math.abs(t.value - 50) / 50;
function fingerprintLayout(age) {
  return traits.flatMap((t, i) => {
    const m = lean(t), a = axisAngle(i) + (t.value >= 50 ? 0 : Math.PI);
    const e = easeOut((age - 0.3 - i * 0.2) / 1.6), d = FP.L * (0.3 + 0.65 * m) * e, beat = 1 + 0.06 * e * Math.sin(age * 2 + i * 1.3);
    return [...Array(FP.n)].map((_, k) => {
      // Every tail starts at the centre, so where they overlap they add up into one larger, hotter shape.
      const f = 1 - k / (FP.n - 1), at = d * f;
      return { x: FP.x + Math.cos(a) * at, y: FP.y + (Math.sin(a) * at) / AR, r: (0.026 + (0.026 + 0.018 * m) * f) * beat, w: (0.22 + (0.75 + 0.4 * m) * Math.pow(f, 1.3)) * (0.4 + 0.6 * e) * beat };
    });
  });
}

// Vibe check: one row per trait. Heat streams out from the midpoint toward the side you lean, so each row reads on its own.
const VIBE = { x0: 6, x1: 94, top: 0.2, bottom: 0.77, lift: 0.012, n: 7 }; // x in stage %, rows in stage heights
const vibeY = (i) => VIBE.top + ((VIBE.bottom - VIBE.top) * i) / Math.max(1, traits.length - 1);
const vibeX = (v) => VIBE.x0 + ((VIBE.x1 - VIBE.x0) * v) / 100;
function vibeLayout(age) {
  const c = vibeX(50) / 100;
  return traits.flatMap((t, i) => {
    const m = Math.abs(t.value - 50) / 50, e = easeOut((age - 0.3 - i * 0.15) / 1.4), beat = 1 + 0.06 * e * Math.sin(age * 2 + i * 1.3);
    const head = c + (vibeX(Math.min(96, Math.max(4, t.value))) / 100 - c) * e, y = fromStage(vibeY(i) - VIBE.lift);
    // A comet: hottest at your mark, thinning back to the midpoint.
    return [...Array(VIBE.n)].map((_, k) => {
      const f = 1 - k / (VIBE.n - 1);
      return { x: fromStage(c + (head - c) * f), y, r: (0.026 + (0.017 + 0.012 * m) * f) * beat, w: (0.25 + (0.55 + 0.35 * m) * f) * (0.4 + 0.6 * e) * beat };
    });
  });
}

// ---------- panel helpers ----------

const head = (title, right = ymd(S.totals.lastDate)) => `<div class="ph"><p class="lbl">${title}</p><p class="lbl">${right}</p></div>`;
const hud = (code, title) => `<div class="hud"><span>${code} · ${title}</span><span>${serial}</span></div>`;
const cell = (label, value, sub = "") => `<div class="cell"><div><p class="micro" style="opacity:0.7">${label}</p><p class="val roll">${value}${sub ? `<span class="sub">${sub}</span>` : ""}</p></div></div>`;
// A label that rides on hotspot `i`; `at` is its starting spot so nothing jumps before the first frame.
const hot = (i, at, name, count, size = 4.6) => `<span class="hot" data-b="${i}" style="left:${toStage(at.x) * 100}%;top:${toStage(at.y) * 100}%;opacity:0">${count == null ? "" : `<i class="roll">${count}</i>`}<b style="font-size:${size}cqw">${esc(name)}</b></span>`;
const typed = (text, size) => `<p class="quote blend type" style="font-size:${size}cqw">${[...text].map((c) => `<span class="ch">${esc(c)}</span>`).join("")}</p>`;
const bigNum = (text, unit = "", size, cls = "") => `<p class="big roll ${cls}" style="font-size:${size ?? fit(text, [[3, 40], [5, 31], [7, 24], [Infinity, 18]])}cqw">${text}${unit ? `<span class="unit">${unit}</span>` : ""}</p>`;

function clockLayer() {
  const { x: cx, y: cy, R } = DIAL, VW = 1000, VH = 1000 * AR;
  const at = (h, k) => [cx + Math.cos(hourAngle(h)) * R * k, cy + (Math.sin(hourAngle(h)) * R * k) / AR];
  const ticks = [...Array(24)].map((_, h) => {
    const major = h % 3 === 0, [x0, y0] = at(h, major ? 0.88 : 0.93), [x1, y1] = at(h, major ? 1.12 : 1.07);
    return `<line x1="${x0 * VW}" y1="${y0 * VH}" x2="${x1 * VW}" y2="${y1 * VH}" stroke-width="${major ? 1.4 : 1}" stroke-opacity="${major ? 0.95 : 0.7}"/>`;
  }).join("");
  const name = (h) => (h % 12 || 12) + (h < 12 ? "A" : "P");
  const labels = [0, 3, 6, 9, 12, 15, 18, 21].map((h) => {
    const [x, y] = at(h, 1.3);
    return `<span class="hr${h % 6 === 0 ? " major" : ""}" style="left:${x * 100}%;top:${y * 100}%">${name(h)}</span>`;
  }).join("");
  const peak = S.time.peakHour;
  return `<div class="abs">
    <svg class="dial" viewBox="0 0 ${VW} ${VH.toFixed(1)}" aria-hidden="true"><circle cx="${cx * VW}" cy="${(cy * VH).toFixed(1)}" r="${R * VW}" stroke-width="1.2"/>${ticks}</svg>
    ${labels}
    <div class="ring-c" style="left:${cx * 100}%;top:${cy * 100}%"><span class="micro" style="opacity:0.7">Hottest hour</span><b class="roll">${fmt(S.time.byHour[peak])}</b><span class="micro" style="opacity:0.7">prompts at ${hourLabel(peak)}</span></div>
    <span class="micro" style="position:absolute;left:5.5cqw;top:11cqw;opacity:0.7">Heat by hour of day</span>
    <span class="micro" style="position:absolute;right:5.5cqw;top:11cqw;opacity:0.7">${fmt(total)} prompts</span>
    <span class="micro" style="position:absolute;left:5.5cqw;top:calc(100% - var(--sheet) - 5cqw);opacity:0.7">${S.time.lateNightPct}% after midnight</span>
    <span class="micro" style="position:absolute;right:5.5cqw;top:calc(100% - var(--sheet) - 5cqw);opacity:0.7">${(S.totals.lastDate ?? "").slice(0, 4)}</span>
  </div>`;
}

function growthLayer() {
  const VW = 1000, VH = 1000 * AR, L = growthLayout(0), y = toStage(GROW_Y) * VH;
  const pts = L.map((b) => [toStage(b.x) * VW, y]);
  return `<div class="abs">
    <svg class="chartline" viewBox="0 0 ${VW} ${VH.toFixed(1)}" aria-hidden="true">
      <path class="mline" pathLength="1" d="M ${pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join(" L ")}"/>
      ${pts.map(([x], i) => `<circle class="mnode" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" style="--d:${i}"/>`).join("")}
    </svg>
    ${months.map(([k, v], i) => `<span class="mlabel" style="left:${pts[i][0] / 10}%;top:${(y / VH) * 100}%;--d:${i}"><b>${monthName(k)}</b><i class="roll">${fmt(v)}</i></span>`).join("")}
  </div>`;
}

function planetLayer() {
  const VW = 1000, VH = 1000 * AR, cx = 500, cy = toStage(ORBIT_Y) * VH, R0 = AGENT_R * VW, reach = R0 + 130;
  // Each name starts at twelve o'clock and runs clockwise just outside its circle.
  const around = (id, r) => `<path id="${id}" d="M ${cx} ${(cy - r).toFixed(1)} A ${r.toFixed(1)} ${r.toFixed(1)} 0 1 1 ${cx} ${(cy + r).toFixed(1)} A ${r.toFixed(1)} ${r.toFixed(1)} 0 1 1 ${cx} ${(cy - r).toFixed(1)}"/>`;
  return `<div class="abs" style="clip-path:inset(0 0 var(--sheet) 0)">
    <svg class="orbit" viewBox="0 0 ${VW} ${VH.toFixed(1)}" aria-hidden="true">
      <defs>${agents.map(([, v], i) => around(`agent-${i}`, agentR(v) * VW + 12)).join("")}</defs>
      <line class="faint dash" x1="${cx - reach}" y1="${cy.toFixed(1)}" x2="${cx + reach}" y2="${cy.toFixed(1)}"/>
      <line class="faint dash" x1="${cx}" y1="${(cy - reach).toFixed(1)}" x2="${cx}" y2="${(cy + reach).toFixed(1)}"/>
      ${agents.map(([, v], i) => `<circle class="ring" pathLength="1" cx="${cx}" cy="${cy.toFixed(1)}" r="${(agentR(v) * VW).toFixed(1)}" style="--d:${i}"/>`).join("")}
      ${agents.map(([k, v], i) => `<text class="agl"><textPath href="#agent-${i}" startOffset="6">${esc(SOURCE_LABEL[k] ?? k)}<tspan class="n"> · ${fmt(v.prompts)}</tspan></textPath></text>`).join("")}
    </svg>
  </div>`;
}

function phraseLayer() {
  const y = (i) => toStage(rowY(i)) * 100, yTop = y(0) - 6, yEnd = y(phrases.length - 1);
  const ticks = [...Array(plotMax / plotStep + 1)].map((_, k) => k * plotStep);
  return `<div class="abs">
    ${phrases.map((_, i) => `<i class="rowg" style="top:${y(i)}%"></i>`).join("")}
    ${ticks.map((v) => `<i class="colg" style="left:${plotX(v)}%;top:${yTop}%;height:${yEnd - yTop + 3}%"></i><span class="axis" style="left:${plotX(v)}%;top:${yTop}%">${fmt(v)}</span>`).join("")}
    <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${phrases.map((_, i) => `<line id="ps-${i}" style="stroke:#161616;stroke-opacity:0.55;stroke-width:1.4" x1="${PLOT.x0}" x2="${PLOT.x0}" y1="${y(i)}" y2="${y(i)}"/>`).join("")}</svg>
    ${phrases.map((p, i) => `<i class="mark" id="pm-${i}" style="--d:${i}"></i><span class="chip word${i ? "" : " lead"}" id="pb-${i}" style="--d:${i};--fs:${(5 - i * 0.35).toFixed(2)}cqw"><em class="rd">0×</em><b>${esc(p.name)}</b></span>`).join("")}
  </div>`;
}

// Stems grow from zero with their hotspots; each phrase chip rides its node, flipping left if it would run off.
function phraseTick(el) {
  phrases.forEach((p, i) => {
    const x = toStage(blobs[i].x) * 100, y = toStage(blobs[i].y) * 100;
    const m = el.querySelector(`#pm-${i}`), b = el.querySelector(`#pb-${i}`), st = el.querySelector(`#ps-${i}`);
    m.style.left = b.style.left = x + "%"; m.style.top = b.style.top = y + "%";
    st.setAttribute("x2", Math.max(PLOT.x0, x));
    b.classList.toggle("flip", x + (b.offsetWidth / el.clientWidth) * 100 + 3.4 > 97);
    // The count ticks up as the node travels out to it.
    const n = Math.min(p.count, Math.round(((x - PLOT.x0) / (PLOT.x1 - PLOT.x0)) * plotMax));
    b.querySelector(".rd").textContent = `${fmt(Math.max(0, n))}×`;
  });
}

// A thin white ring the size of a hotspot's glow, with its name and count set inside. It rides its hotspot.
const orb = (i, at, name, count, size) => `<span class="hot orb" data-b="${i}" style="left:${toStage(at.x) * 100}%;top:${toStage(at.y) * 100}%;opacity:0;--d:${(at.r * 1.1 * 2 * 100).toFixed(1)}cqw"><span class="ring"></span><b style="font-size:${size}cqw">${esc(name)}</b><i class="roll">${count}</i></span>`;

// Manners: kind words on the left, cross ones on the right, each a hotspot sized by how often it happened. Things
// that never happened get an empty ring, so a zero still shows up.
const mannerOf = (pct) => Math.round((pct / 100) * total);
const manners = [
  { name: "please", n: mannerOf(S.style.pleasePct), x: 0.33, y: 0.36, c: 0 },
  { name: "compliments", n: S.style.praiseCount, x: 0.17, y: 0.54, c: 0 },
  { name: "thanks", n: mannerOf(S.style.thanksPct), x: 0.43, y: 0.58, c: 0 },
  { name: "sorry", n: S.style.sorryCount, x: 0.13, y: 0.25, c: 0 },
  { name: "frustrated", n: S.style.frustrationCount, x: 0.73, y: 0.38, c: 1 },
  { name: "swears", n: S.style.swearCount, x: 0.85, y: 0.56, c: 1 },
  { name: "caps rage", n: S.style.capsRageCount, x: 0.65, y: 0.6, c: 1 },
];
const mannerMax = Math.max(1, ...manners.map((m) => m.n));
const mannerR = (m) => (m.n ? 0.035 + 0.115 * Math.sqrt(m.n / mannerMax) : 0.055);
const lit = manners.filter((m) => m.n), unlit = manners.filter((m) => !m.n);
const mannerLayout = (age) => lit.map((m, i) => {
  const e = easeOut((age - 0.2 - i * 0.15) / 1.2), beat = 1 + 0.04 * e * Math.sin(age * 1.5 + i * 1.9);
  return { x: fromStage(m.x), y: fromStage(m.y), r: mannerR(m) * (0.3 + 0.7 * e) * beat, w: (0.7 + 0.5 * Math.sqrt(m.n / mannerMax)) * e, c: m.c };
});
function mannerLayer() {
  const L = mannerLayout(99), size = (m) => 2.6 + 1.8 * Math.sqrt(m.n / mannerMax);
  return `<div class="abs">
    <span class="micro side-h" style="left:6%">Kind</span><span class="micro side-h" style="left:58%">Cross</span>
    ${lit.map((m, i) => orb(i, L[i], m.name, `${fmt(m.n)}×`, size(m))).join("")}
    ${unlit.map((m, i) => `<span class="orb ghost" style="left:${m.x * 100}%;top:${m.y * 100}%;--d:${(mannerR(m) * 1.1 * 2 * 100).toFixed(1)}cqw;--k:${i}"><span class="ring"></span><b style="font-size:2.3cqw">${esc(m.name)}</b><i>0×</i></span>`).join("")}
  </div>`;
}

function projectLayer() {
  const L = projectLayout(0);
  return `<div class="abs">${projects.map((p, i) => orb(i, L[i], p.name.slice(0, 18), `${fmt(p.count)} prompts`, i ? 2.8 + 1.4 * Math.sqrt(p.count / projMax) : 5.2)).join("")}</div>`;
}

function fingerprintLayer() {
  const cx = 0.5, cy = toStage(FP.y), L = FP.L * 1.1, VW = 1000, VH = 1000 * AR;
  const at = (a, k) => [cx + Math.cos(a) * L * k, cy + (Math.sin(a) * L * k) / AR];
  const lines = traits.map((_, i) => { const [x0, y0] = at(axisAngle(i) + Math.PI, 1), [x1, y1] = at(axisAngle(i), 1); return `<line x1="${x0 * VW}" y1="${(y0 * VH).toFixed(1)}" x2="${x1 * VW}" y2="${(y1 * VH).toFixed(1)}"/>`; }).join("");
  const poles = traits.map((t, i) => [[t.right, axisAngle(i), t.value >= 50], [t.left, axisAngle(i) + Math.PI, t.value < 50]].map(([name, a, on]) => {
    // Left and right poles sit just above their arm's end, so they stay on the page.
    const side = Math.abs(Math.cos(a)) > 0.9 ? (Math.cos(a) < 0 ? " l" : " r") : "", [x, y] = at(a, side ? 1 : 1.1);
    return `<span class="pole${side}${on ? " on" : ""}" style="left:${x * 100}%;top:${y * 100}%">${esc(name)}</span>`;
  }).join("")).join("");
  return `<div class="abs"><svg class="fp" viewBox="0 0 ${VW} ${VH.toFixed(1)}" aria-hidden="true">${lines}<circle cx="${cx * VW}" cy="${(cy * VH).toFixed(1)}" r="5"/></svg>${poles}</div>`;
}

// Syntax: prompt lengths as hotspots sized by area. A one-word prompt is a speck, the typical prompt a small glow,
// and the longest one swells until it's too big for the slide and runs under the paper.
const SYN_R = 0.46; // the longest prompt's radius, in field widths
const synR = (words) => Math.max(0.028, SYN_R * Math.sqrt(words / Math.max(1, S.style.longestPromptWords)));
const synSpots = [
  { x: 0.3, y: 0.21, words: S.style.medianWords, w: 1.25, c: 0, at: 0.3, name: `${fmt(S.style.medianWords)} words`, count: "Typical" },
  { x: 0.12, y: 0.12, words: 1, w: 1.6, c: 0, at: 0.6, name: "1 word", count: `${S.style.oneWordPct}% of prompts` },
  { x: 0.7, y: 0.6, words: S.style.longestPromptWords, w: 1.05, c: 1, at: 0.9, name: `${fmt(S.style.longestPromptWords)} words`, count: "Longest" },
];
const synLayout = (age) => synSpots.map((p, i) => {
  if (!tw.speed) age = 99;
  // The longest takes its time getting big.
  const e = easeOut((age - p.at) / (i === 2 ? 2.6 : 0.8)), beat = 1 + 0.04 * e * Math.sin(age * 1.6 + i * 2);
  return { x: fromStage(p.x), y: fromStage(p.y), r: (0.02 + (synR(p.words) - 0.02) * e) * beat, w: p.w * Math.min(1, e * 3), c: p.c };
});
const synLayer = () => { const L = synLayout(99); return `<div class="abs">${synSpots.map((p, i) => (i === 2 ? hot(i, L[i], p.name, p.count, 5.6) : hot(i, L[i], p.name, p.count, 3.6).replace('class="hot"', 'class="hot side"'))).join("")}</div>`; };

// Warning: a lab report. The colour lives in one petri dish, where each colony is a short reply you kept sending,
// sized by how often. The dish sits in the page flow; each frame reads where it landed so the colonies stay inside it.
const colonies = S.phrases.topShortReplies.slice(0, 6), colonyMax = colonies[0]?.count || 1;
// Dish units (-1..1). The dish runs off the right edge, so the colonies keep to the part still on the page.
const COLONY_AT = [[-0.4, -0.22], [0.22, 0.1], [-0.24, 0.42], [0.06, -0.46], [-0.64, 0.18], [0.3, -0.3]];
let DISH = { x: 0.7, y: 0.17, r: 0.18 }; // stage widths / heights
const labLayout = (age) => colonies.map((c, i) => {
  if (!tw.speed) age = 99;
  const [u, v] = COLONY_AT[i], s = Math.sqrt(c.count / colonyMax), e = easeOut((age - 0.5 - i * 0.22) / 1.6);
  const beat = 1 + 0.04 * e * Math.sin(age * 1.3 + i * 1.7);
  return { x: fromStage(DISH.x + u * DISH.r), y: fromStage(DISH.y + (v * DISH.r) / AR), r: ((DISH.r * (0.14 + 0.2 * s)) / 1.1) * (0.3 + 0.7 * e) * beat, w: (0.75 + 0.45 * s) * e, c: 0 };
});
function labTick(el) {
  const d = el.querySelector(".dish"), st = document.getElementById("stage").getBoundingClientRect();
  if (!d) return;
  const r = d.getBoundingClientRect();
  DISH = { x: (r.left + r.width / 2 - st.left) / st.width, y: (r.top + r.height / 2 - st.top) / st.height, r: r.width / 2 / st.width };
}
function labReport() {
  const period = `${monthName(S.totals.firstDate)}–${monthName(S.totals.lastDate)} ${S.totals.lastDate.slice(0, 4)}`;
  const fs = fit(P.roast + P.compliment, [[520, 3.9], [680, 3.7], [840, 3.3], [Infinity, 3]]);
  return [
    `<div class="lab-head">
      <div class="lab-legend">${colonies.map((c, i) => `<p><b>${pad(i + 1)}</b><span>“${esc(c.name)}”</span><i>×${fmt(c.count)}</i></p>`).join("")}</div>
      <div class="dish-w"><div class="dish">${colonies.map((_, i) => `<span class="n" style="left:${50 + COLONY_AT[i][0] * 50}%;top:${50 + COLONY_AT[i][1] * 50}%">${pad(i + 1)}</span>`).join("")}</div><p class="fig">Fig. 1 · Cultures, ${period}</p></div>
    </div>`,
    `<div class="lab-sec" style="--fs:${fs}cqw"><div class="ph"><p class="lbl">01 · Findings</p><p class="lbl">Severity: mild</p></div><p class="body">${esc(P.roast)}</p></div>`,
    P.compliment ? `<div class="lab-sec" style="--fs:${fs}cqw"><div class="ph"><p class="lbl">02 · Conclusion</p><p class="lbl">Prognosis: good</p></div><p class="body">${esc(P.compliment)}</p></div>` : "",
  ];
}

function weekChart() {
  const order = [1, 2, 3, 4, 5, 6, 0], vals = order.map((d) => S.time.byWeekday[d]), max = Math.max(...vals) || 1, top = vals.indexOf(max);
  const xs = vals.map((_, i) => 8 + (i / 6) * 84), ys = vals.map((v) => 0.92 - (v / max) * 0.7);
  const at = (i) => `left:${xs[i]}%;--d:${i}`;
  return `<div class="chart">
    ${vals.map((_, i) => `<i class="pill${order[i] === 0 || order[i] === 6 ? " wknd" : ""}" style="${at(i)};top:calc(var(--H) * ${ys[i].toFixed(3)} - 8cqw);height:calc(var(--H) * ${(0.92 - ys[i]).toFixed(3)} + 8cqw);--rise:calc(var(--H) * ${(0.92 - ys[i]).toFixed(3)} + 6cqw)"></i>`).join("")}
    ${vals.map((v, i) => `<span class="num roll${i === top ? " peak" : ""}" style="${at(i)};top:calc(var(--H) * ${ys[i].toFixed(3)} - 9.5cqw)">${v}</span>`).join("")}
    ${order.map((d, i) => `<span class="day" style="left:${xs[i]}%">${DAYS[d]}</span>`).join("")}
  </div>`;
}

// How far a 0..100 reading leans, in words, pointing at the side it leans to.
function leanWord(v) {
  const p = Math.max(v, 100 - v), w = p >= 80 ? "Strong lean" : p >= 65 ? "Clear lean" : p >= 55 ? "Slight lean" : "Dead even";
  return p < 55 ? w : v < 50 ? `← ${w}` : `${w} →`;
}

function vibeLayer() {
  const y = (i) => vibeY(i) * 100, mid = vibeX(50);
  return `<div class="abs">
    ${traits.map((_, i) => `<i class="vline" style="left:${vibeX(0)}%;width:${vibeX(100) - vibeX(0)}%;top:${y(i)}%"></i>`).join("")}
    <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${traits.map((_, i) => `<line id="vs-${i}" style="stroke:#161616;stroke-opacity:0.55;stroke-width:1.4" x1="${mid}" x2="${mid}" y1="${y(i)}" y2="${y(i)}"/>`).join("")}</svg>
    ${traits.map((t, i) => `<span class="vpole l" style="top:${y(i)}%;--d:${i}">${esc(t.left)}</span><span class="vpole r" style="top:${y(i)}%;--d:${i}">${esc(t.right)}</span>${t.note ? `<p class="vnote" style="top:${y(i)}%;--d:${i}">${esc(t.note)}</p>` : ""}`).join("")}
    ${traits.map((_, i) => [0, 50, 100].map((v) => `<i class="vend${v === 50 ? " mid" : ""}" style="left:${vibeX(v)}%;top:${y(i)}%"></i>`).join("")).join("")}
    ${traits.map((t, i) => `<i class="mark" id="vm-${i}" style="--d:${i}"></i><span class="chip" id="vc-${i}" style="--d:${i}"><em class="rd">Dead even</em><b class="roll">${Math.round(Math.max(t.value, 100 - t.value))}%</b></span>`).join("")}
  </div>`;
}

// Each mark rides its row's hottest point along the line; the readout points away from the midpoint unless it would run off the edge.
function vibeTick(el) {
  traits.forEach((_, i) => {
    const x = toStage(blobs[i * VIBE.n].x) * 100, y = vibeY(i) * 100;
    const m = el.querySelector(`#vm-${i}`), c = el.querySelector(`#vc-${i}`);

    el.querySelector(`#vs-${i}`).setAttribute("x2", x);
    const w = (c.offsetWidth / el.clientWidth) * 100 + 3.4;
    c.classList.toggle("flip", x < vibeX(50) ? x - w > 3 : x + w > 97);
    c.querySelector(".rd").textContent = leanWord(((x - VIBE.x0) / (VIBE.x1 - VIBE.x0)) * 100);
  });
}

// Log backgrounds: each hotspot loops on its own slow path, so the colours keep moving behind the card.
const wander = (seed, n) => {
  const base = scatter(seed, n, [0, 0, 1, 1]), r = rng(seed + 99);
  const path = base.map(() => [r() * 6.28, r() * 6.28, 0.25 + r() * 0.25, 0.2 + r() * 0.25]);
  return (age) => base.map((b, i) => { const [p, q, sx, sy] = path[i]; return { ...b, x: b.x + 0.22 * Math.sin(age * sx + p), y: b.y + 0.16 * Math.cos(age * sy + q) }; });
};

// ---------- burn: cover → volume ----------

// The cover's hottest point ignites and a wavy ring spreads out from it with a dark chromatic fringe (navy, magenta,
// the next palette's orange and yellow). The next slide is already live underneath, so the ring burns the cover away
// to reveal it: a frozen copy of the cover rides on top with a hole cut out just behind the fringe.
const burnEl = document.getElementById("burn"), BW = 160, NA = 512, T_BURN = 0.9;
let burning = null;
const smooth = (k) => k * k * (3 - 2 * k);
// Where the field is hottest right now, in stage units.
function hottest() {
  const n = 48, m = Math.round(n * AR);
  let best = -1, bx = 0.5, by = 0.5;
  for (let j = 0; j <= m; j++) for (let i = 0; i <= n; i++) {
    const h = heatAt(i / n, j / m);
    if (h > best) { best = h; bx = i / n; by = j / m; }
  }
  // Before the field's first frame there's nothing to sample; fall back to the main hotspot.
  return best > 0 ? { x: bx, y: by } : { x: toStage(blobs[0].tx), y: toStage(blobs[0].ty) };
}
function burn(to) {
  const BH = Math.round(BW * AR), bx = burnEl.getContext("2d");
  burnEl.width = BW; burnEl.height = BH; burnEl.style.display = "block";
  const img = bx.createImageData(BW, BH), d = img.data, pal = PALETTES[tw.pal || slides[to].pal].stops.map(hex);
  const NAVY = hex("#1B1F6E"), MAG = hex("#E0357F"), CYAN = hex("#3FA0F0");
  const FR = [[0, NAVY], [0.3, MAG], [0.5, pal[3]], [0.68, pal[4]]];
  const col = [0, 0, 0], mix = (a, b, k) => { col[0] = a[0] + (b[0] - a[0]) * k; col[1] = a[1] + (b[1] - a[1]) * k; col[2] = a[2] + (b[2] - a[2]) * k; return col; };
  // Each pixel's distance and angle from the origin; the edge's shape is a function of angle, so it wraps seamlessly.
  const o = hottest(), ox = o.x, oy = o.y * AR, R = new Float32Array(BW * BH), A = new Uint16Array(BW * BH);
  let reach = 0;
  for (let j = 0, p = 0; j < BH; j++) for (let i = 0; i < BW; i++, p++) {
    const dx = i / (BW - 1) - ox, dy = (j / (BH - 1)) * AR - oy;
    R[p] = Math.hypot(dx, dy); reach = Math.max(reach, R[p]);
    A[p] = Math.floor(((Math.atan2(dy, dx) / (2 * Math.PI) + 1) % 1) * NA) % NA;
  }
  const lobeA = new Float32Array(NA), frontA = new Float32Array(NA), fwA = new Float32Array(NA);

  // Freeze the cover (its field, paper sheet and slide) into a layer above the slides, then go to the next slide under it.
  const oldEl = els[cur], home = oldEl.nextSibling, cover = document.createElement("div");
  cover.className = "burn-cover";
  const fc = document.createElement("canvas");
  fc.width = field.width; fc.height = field.height; fc.getContext("2d").drawImage(field, 0, 0);
  const sh = document.createElement("div");
  sh.className = "sheet"; sh.style.cssText = `height:${slides[cur].sheet}%;transition:none`;
  cover.append(fc, sh, oldEl);
  // Going on stops the cover's counters mid-roll, so land them first.
  oldEl.querySelectorAll(".roll").forEach((n) => { if (n.dataset.final && n.firstChild?.nodeType === 3) n.firstChild.textContent = n.dataset.final; });
  stage.insertBefore(cover, burnEl);
  go(to, true, true);

  const start = performance.now();
  const step = (now) => {
    if (burning !== step) return;
    const s = (now - start) / 1000, W = stage.clientWidth, H = stage.clientHeight;
    const F = -0.02 + (reach + 0.3) * smooth(clamp01(s / T_BURN));
    // The edge starts as a round spark and grows its scallops as it spreads.
    const wob = clamp01(F / 0.3);
    let hole = "";
    for (let k = 0; k < NA; k++) {
      const th = (k / NA) * 2 * Math.PI;
      // A scalloped edge; the dark core pools in each bulge and the fringe runs wider there.
      const lobe = Math.abs(Math.sin(th * 6 + s * 0.8 + Math.sin(th * 2)));
      lobeA[k] = lobe;
      frontA[k] = F + wob * (0.03 * Math.sin(th * 5 + s * 1.5) + 0.03 * lobe + 0.008 * Math.sin(th * 41 + s * 4));
      fwA[k] = 0.12 + 0.09 * lobe;
      // The hole sits under the fringe's yellow, so its hard edge never shows.
      if (k % 2 === 0) {
        const rh = Math.max(0, frontA[k] - 0.72 * fwA[k]);
        hole += `${k ? "L" : "M"}${((ox + rh * Math.cos(th)) * W).toFixed(1)} ${((oy + rh * Math.sin(th)) * W).toFixed(1)}`;
      }
    }
    cover.style.clipPath = `path(evenodd, "M-1 -1H${W + 1}V${H + 1}H-1Z${hole}Z")`;
    let p = 0;
    for (let n = 0; n < BW * BH; n++, p += 4) {
      const k = A[n], dd = frontA[k] - R[n];
      let a = 1;
      if (dd < -0.014) { d[p + 3] = 0; continue; }
      if (dd < 0) { mix(CYAN, CYAN, 0); a = 0.75 * (1 + dd / 0.014); }
      else {
        const q = dd / fwA[k];
        if (q > 1.3) { d[p + 3] = 0; continue; }
        if (q < 0.68) {
          let f = 1; while (FR[f][0] < q && f < FR.length - 1) f++;
          mix(FR[f - 1][1], FR[f][1], clamp01((q - FR[f - 1][0]) / (FR[f][0] - FR[f - 1][0])));
          if (q < 0.3) { const c = col.slice(); mix(c, MAG, (1 - lobeA[k]) * 0.75 * (1 - q / 0.3)); }
        } else {
          // Behind the fringe the yellow glows off into the revealed slide.
          mix(pal[4], pal[3], 0.25 * clamp01((q - 0.68) / 0.6));
          a = 1 - smooth(clamp01((q - 0.76) / 0.54));
        }
      }
      d[p] = col[0]; d[p + 1] = col[1]; d[p + 2] = col[2]; d[p + 3] = a * 255;
    }
    bx.putImageData(img, 0, 0);
    if (s < T_BURN) return requestAnimationFrame(step);
    // Done: put the cover slide back where it lives, hidden.
    oldEl.classList.remove("active");
    root.insertBefore(oldEl, home);
    cover.remove();
    burnEl.style.display = "none"; burning = null;
  };
  burning = step;
  requestAnimationFrame(step);
}

// ---------- player ----------

const root = document.getElementById("slides"), progress = document.getElementById("progress"), stage = document.getElementById("stage");
const withIndex = (h, i) => (!h ? "" : /^\s*<\w+[^>]*\sstyle="/.test(h) ? h.replace('style="', `style="--i:${i};`) : h.replace(/^(\s*)<(\w+)/, `$1<$2 style="--i:${i}"`));
let els = [], bars = [], cur = -1;
function build() {
  measure(); sizeField(); layoutDial();
  root.innerHTML = slides.map((s) => `
    <section class="slide" style="--sheet:${s.sheet}%;--fg:${s.fg}">
      ${s.extra ? s.extra() : ""}
      <div class="top">${s.top().map(withIndex).join("")}</div>
      <div class="panel">${s.bottom().map(withIndex).join("")}</div>
    </section>`).join("");
  progress.innerHTML = slides.map(() => "<span></span>").join("");
  els = [...root.children]; bars = [...progress.children];
}
// Re-lay out when the stage changes shape (rotating a phone, resizing a window).
let resizeTimer;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const st = document.getElementById("stage"), next = st.clientHeight / st.clientWidth;
    if (!els.length || Math.abs(next - AR) < 0.01) return;
    const at = cur; build(); cur = -1; go(at);
  }, 150);
}).observe(stage);

// `keep` leaves the outgoing slide showing; the burn hides it itself once it has burned away.
function go(i, force, keep) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur && !force) return;
  if (burning && !force) return;
  if (cur === 0 && i === 1 && !force && tw.speed) return burn(i);
  if (!keep) els[cur]?.classList.remove("active");
  cur = i;
  const el = els[cur], s = slides[cur];
  el.classList.remove("active"); void el.offsetWidth; el.classList.add("active");
  stage.style.setProperty("--sheet", s.sheet + "%");
  stage.style.setProperty("--fg", s.fg);
  setField(s);
  rollNumbers(el);
  typeText(el);
  hotEls = [...el.querySelectorAll(".hot")];
  bars.forEach((b, j) => { b.className = j < cur ? "done" : j === cur ? "active" : ""; });
  document.getElementById("nav").style.display = cur === slides.length - 1 ? "none" : "";
  if (cur === slides.length - 1) document.fonts.ready.then(() => setTimeout(drawShare, 1000));
}

const [prevBtn, nextBtn] = document.querySelectorAll("#nav button");
prevBtn.onclick = () => go(cur - 1);
nextBtn.onclick = () => go(cur + 1);
addEventListener("keydown", (e) => {
  if (e.target.closest?.(".tweak")) return;
  if (["ArrowRight", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") go(cur - 1);
});
root.addEventListener("click", (e) => {
  if (e.target.id === "dl") {
    const a = document.createElement("a");
    a.download = "how-i-ai-wrapped.png";
    a.href = document.getElementById("share").toDataURL("image/png");
    a.click();
  }
  if (e.target.id === "replay") go(0);
});

// ---------- tweak panel ----------

const $ = (id) => document.getElementById(id), css = getComputedStyle(document.documentElement);
$("tw-pal").innerHTML += Object.keys(PALETTES).map((k) => `<option value="${k}">${k}</option>`).join("");
$("tw-grain").value = parseFloat(css.getPropertyValue("--grain"));
$("tw-blur").value = parseFloat(css.getPropertyValue("--blur"));
$("tw-speed").value = tw.speed;
$("tweak-toggle").onclick = () => { $("tweak").hidden = !$("tweak").hidden; };
$("tw-pal").onchange = (e) => { tw.pal = e.target.value; setField(slides[cur]); };
$("tw-mode").onchange = (e) => { tw.mode = e.target.value; setField(slides[cur]); };
$("tw-grain").oninput = (e) => document.documentElement.style.setProperty("--grain", e.target.value);
$("tw-blur").oninput = (e) => document.documentElement.style.setProperty("--blur", e.target.value + "px");
$("tw-speed").oninput = (e) => { tw.speed = +e.target.value; };

build();
go(parseInt(location.hash.slice(1)) || 0);
requestAnimationFrame(frame);
</script>
</body>
</html>
